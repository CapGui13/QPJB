<style>
:root {
  --felt:    #1a4d2e;
  --felt-dk: #0f2d1a;
  --felt-md: #206038;
  --felt-lt: #2e7d4f;
  --gold:    #c8973a;
  --cream:   #faf6ef;
  --card-bg: #fffdf8;
  --card-bd: #e8dfc8;
  --red:     #c0392b;
  --blue:    #1a56c4;
  --suit-s:  #6b9fd4;
  --suit-h:  #d4706a;
  --suit-d:  #c8924a;
  --suit-c:  #6aaa78;
  --txt:     #1a1410;
  --txt2:    #6b5d4e;
  --txt3:    #b0a090;
  --sh-sm:   0 2px 8px rgba(0,0,0,.13), 0 1px 2px rgba(0,0,0,.07);
  --sh-lg:   0 6px 24px rgba(0,0,0,.22), 0 2px 6px rgba(0,0,0,.09);
  --r:       11px;
}
@media(prefers-color-scheme:dark){
  :root{
    --cream:#0d1a10; --card-bg:#14200f; --card-bd:#253820;
    --txt:#f0ebe0; --txt2:#8aaa88; --txt3:#4a6048;
    --sh-sm:0 2px 10px rgba(0,0,0,.5); --sh-lg:0 8px 28px rgba(0,0,0,.6);
  }
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
*{-webkit-user-select:none;user-select:none}
input,textarea{-webkit-user-select:text;user-select:text}
html{overflow-y:scroll;background:var(--cream)}
body{font-family:'Source Serif 4',Georgia,serif;background:var(--cream);color:var(--txt);min-height:100vh;max-width:520px;margin:0 auto;}

/* ── SPLASH ── */
#splash{
  position:fixed;inset:0;z-index:9999;
  background:var(--cream);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:24px;
  transition:opacity .4s ease, visibility .4s;
}
#splash.hidden{opacity:0;visibility:hidden;pointer-events:none;transition:none}
#splash.fade-out{opacity:0;visibility:hidden;pointer-events:none}
.splash-logo{font-family:'Exo 2',sans-serif;font-size:52px;font-weight:800;letter-spacing:2px;transform:translateZ(0);opacity:0;transition:opacity .2s}
.splash-logo span:nth-child(1){color:#6b9fd4}
.splash-logo span:nth-child(2){color:#d4706a}
.splash-logo span:nth-child(3){color:#c8924a}
.splash-logo span:nth-child(4){color:#6aaa78}
.splash-title{color:rgba(255,255,255,.5);font-size:13px;font-family:'Exo 2',sans-serif;letter-spacing:1px}
.splash-dots{display:flex;gap:8px;height:8px}
.splash-dots span{width:8px;height:8px;border-radius:50%;background:rgba(200,151,58,.5);animation:splashPulse 1.2s infinite ease-in-out;will-change:opacity;transform:translateZ(0)}
.splash-dots span:nth-child(2){animation-delay:.2s}
.splash-dots span:nth-child(3){animation-delay:.4s}
@keyframes splashPulse{0%,80%,100%{opacity:.3}40%{opacity:1}}
header{
  pointer-events:none;
  user-select:none;
  background:#141414;
  padding:max(env(safe-area-inset-top,0px),12px) 18px 12px;
  display:flex;align-items:center;justify-content:space-between;
  position:fixed;top:0;left:0;right:0;
  max-width:520px;margin:0 auto;
  z-index:200;
  border-bottom:1px solid rgba(200,151,58,.28);
}
.logo-text{position:absolute;left:50%;transform:translateX(-50%);pointer-events:none;white-space:nowrap;}
#vhome{padding-top:60px}
#vdeal{padding-top:60px}
#vseance{padding-top:110px}
.logo{display:flex;align-items:center;gap:11px}
.logo-icon{
  width:56px;height:36px;border-radius:8px;flex-shrink:0;
  background:#1c1c24;border:1px solid rgba(200,151,58,.25);
  display:flex;align-items:center;justify-content:center;
  font-size:13px;font-weight:800;font-family:Syne,sans-serif;letter-spacing:1px;
  padding:0 7px;
}
.logo-text h1{font-family:'Exo 2',sans-serif;font-size:15px;font-weight:700;color:#fff}
.logo-text p{font-size:10px;color:rgba(255,255,255,.33);margin-top:1px;letter-spacing:.5px}
.hd-suits{display:flex;gap:4px}
.hd-suits span{font-size:16px}
.hs{color:var(--suit-s)}.hh{color:var(--suit-h)}.hd{color:var(--suit-d)}.hc{color:var(--suit-c)}

/* ── CONFIG ── */
.config{
  background:#282828;
  padding:16px 18px 20px;
  border-bottom:1px solid rgba(200,151,58,.15);
}
.cfg-label{font-size:10px;font-weight:600;color:rgba(255,255,255,.36);text-transform:uppercase;letter-spacing:1.2px;margin-bottom:9px}
.cfg-hint{font-size:11px;color:rgba(255,255,255,.26);margin-top:8px;min-height:15px}

/* ── FILE LIST ── */
.file-list{padding:16px 18px;display:flex;flex-direction:column;gap:9px}
.file-item{
  user-select:none;
  background:var(--card-bg);border:1px solid var(--card-bd);
  border-radius:var(--r);padding:13px 15px;
  display:flex;align-items:center;gap:13px;
  cursor:pointer;box-shadow:var(--sh-sm);transition:transform .12s;
}
.file-item.is-pressing{transform:scale(.97)}
.file-item:has(.file-icon:active){transform:none}
.file-item:has(.btn-play:active){transform:none}
.file-icon{
  width:42px;height:42px;border-radius:10px;flex-shrink:0;
  background:linear-gradient(135deg,var(--felt),var(--felt-lt));
  display:flex;align-items:center;justify-content:center;font-size:20px;
  transition:transform .1s,filter .12s;
}
.file-icon.is-pressing{transform:scale(.9);filter:brightness(.8)}
.file-name{font-weight:600;font-size:15px;font-family:'Exo 2',sans-serif}
.file-name-blur{
  filter: blur(4px);
  user-select: none;
  transition: filter .25s, color .25s;
  cursor: pointer;
}
.file-name-blur.revealed{ filter: none; }
.blur-disabled .file-name-blur{ filter: none; cursor: default; }

/* ── BLUR TOGGLE ── */
.blur-toggle-wrap{display:flex;align-items:center;justify-content:center;gap:10px;padding:10px 0 4px;font-size:12px;color:rgba(255,255,255,.5)}
.blur-toggle{position:relative;width:40px;height:22px;cursor:pointer}
.blur-toggle input{opacity:0;width:0;height:0;position:absolute}
.blur-track{position:absolute;inset:0;border-radius:11px;background:rgba(255,255,255,.15);transition:background .2s}
.blur-toggle input:checked + .blur-track{background:var(--gold)}
.blur-thumb{position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:#fff;transition:transform .2s;box-shadow:0 1px 3px rgba(0,0,0,.4)}
.blur-toggle input:checked + .blur-track + .blur-thumb{transform:translateX(18px)}
.file-chev{margin-left:auto;color:var(--gold);font-size:20px;flex-shrink:0}

/* ── DEAL VIEW ── */
.deal-view{display:none}
.deal-nav{
  background:var(--card-bg);border-bottom:1px solid var(--card-bd);
  padding:9px 15px;display:flex;align-items:center;justify-content:space-between;
  position:fixed;top:60px;left:0;right:0;max-width:520px;margin:0 auto;z-index:100;box-shadow:var(--sh-sm);
}
.btn-back{
  display:flex;align-items:center;gap:5px;padding:7px 11px;border-radius:8px;
  border:1.5px solid var(--card-bd);background:transparent;color:var(--txt);
  font-size:13px;font-weight:600;font-family:'Source Serif 4',serif;cursor:pointer;
  transition:transform .1s,filter .1s;
}
.btn-back.is-pressing{transform:scale(.93);filter:brightness(.8)}
.nav-ctr{font-size:12px;color:var(--txt2);font-weight:500}
.nav-arr{display:flex;gap:5px}
.btn-arr{
  width:44px;height:44px;border-radius:10px;border:none;
  background:var(--felt);color:#fff;font-size:24px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  box-shadow:var(--sh-sm);
  transition:filter .12s,transform .1s;
}
.btn-arr.is-pressing{filter:brightness(.8);transform:scale(.93)}
.btn-arr:disabled{background:var(--card-bd);color:var(--txt3);cursor:not-allowed;box-shadow:none;opacity:.5}
@media(hover:hover){
  .btn-arr{width:33px;height:33px;border-radius:8px;font-size:18px;box-shadow:none}
  .btn-arr:disabled{opacity:1}
}

/* ── DEAL CONTENT ── */
.deal-wrap{padding:14px 12px;padding-top:58px;display:flex;flex-direction:column;gap:12px;padding-bottom:48px}

/* ── BOARD HEADER ── */
.board-hdr{
  background:linear-gradient(135deg,var(--felt-dk) 0%,var(--felt-md) 100%);
  border-radius:var(--r);padding:11px 14px;
  display:flex;flex-direction:row;justify-content:space-between;align-items:center;
  box-shadow:var(--sh-lg);border:1px solid rgba(200,151,58,.2);
  gap:10px;
}
.board-num{
  font-family:-apple-system,'SF Pro Text',system-ui,sans-serif;
  color:#fff;font-size:12px;font-weight:600;
  line-height:1.45;
  flex:1;min-width:0;
  max-height:calc(1.45em * 3);
  overflow:hidden;
  display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;
  align-self:center;
}
.board-badges{
  display:flex;gap:5px;flex-direction:row;align-items:center;
  flex-shrink:0;
}
@media(max-width:480px){
  .board-badges{flex-direction:column;align-items:flex-end;gap:4px}
  .board-num{font-size:clamp(10px,2.8vw,12px)}
  .badge-dealer,.badge-vul-box,.badge-contract{width:auto}
}
.badge{
  padding:4px 7px;border-radius:6px;font-size:10px;font-weight:600;
  background:rgba(255,255,255,.1);color:rgba(255,255,255,.7);
  text-align:center;white-space:nowrap;
}
.badge-dealer  {width:90px}
.badge-vul-box {width:68px}
.badge-contract{width:82px}



.badge-vul{background:rgba(185,28,28,.33);color:#fca5a5}
.badge-nov{background:rgba(34,197,94,.18);color:#86efac}

/* ── DIAGRAM ── */
/*
  STRUCTURE :
  ┌─────────────────────────────────────┐
  │              NORD                   │  ← 3-col span, centré
  ├─────────────┬────────────┬──────────┤
  │   OUEST     │  Boussole  │   EST    │
  ├─────────────┴────────────┴──────────┤
  │              SUD                    │  ← 3-col span, centré
  └─────────────────────────────────────┘

  3 colonnes : [Ouest flex] [boussole 56px] [Est flex]
  Nord & Sud : span 3 cols, la main elle-même est centrée via justify-self:center
*/
.diag-card{
  background:linear-gradient(155deg,var(--felt-md) 0%,var(--felt) 50%,var(--felt-dk) 100%);
  border-radius:var(--r);box-shadow:var(--sh-lg);
  border:1px solid rgba(200,151,58,.1);
  padding:10px;
  position:relative;
}
.btn-play-diag{
  position:absolute;top:10px;right:10px;
  display:flex;align-items:center;gap:5px;
  padding:7px 13px;border-radius:8px;
  background:rgba(0,0,0,.35);border:1.5px solid rgba(200,151,58,.4);
  color:#fff;font-size:14px;font-weight:700;
  font-family:'Exo 2',sans-serif;
  cursor:pointer;text-decoration:none;
  white-space:nowrap;z-index:1;
  transition:background .12s;
}
.btn-play-diag:hover{background:rgba(0,0,0,.55)}
/* ── DIAGRAM ── */
.diag-grid{display:flex;flex-direction:column;gap:5px}
.diag-row{display:flex;flex-direction:row;gap:5px;align-items:stretch;justify-content:center}
/* Mains latérales (Ouest/Est) : moitié de la largeur moins boussole et gaps */
.hand{
  flex:1 1 0;
  background:var(--card-bg);
  border:1px solid var(--card-bd);
  border-radius:9px;
  padding:22px 11px 24px;
  box-shadow:var(--sh-sm);
  position:relative;
  min-width:0;
}
.hand::after{
  content:'';position:absolute;inset:0;border-radius:9px;
  background:linear-gradient(135deg,rgba(255,255,255,.05) 0%,transparent 55%);
  pointer-events:none;
}
/* Nord/Sud : même largeur exacte qu'une main latérale, pas de flex */
.hand-ns{
  flex:none;
  width:calc((100% - 54px) / 2);
  margin:0 auto;
}

/* direction label — position absolute so it never affects card width */
.hand-lbl{
  position:absolute;top:6px;left:0;right:0;
  font-size:8px;font-weight:700;letter-spacing:1.1px;text-transform:uppercase;
  color:var(--txt3);
  display:flex;align-items:center;justify-content:center;gap:4px;
}
/* Vulnerability colors on direction label */
.lbl-vul{color:#e05555}
.lbl-nov{color:#5aaa6a}
/* Dealer badge — circled D inline next to direction */
.dealer-badge{
  display:inline-flex;align-items:center;justify-content:center;
  width:13px;height:13px;border-radius:50%;
  border:1.5px solid #ffffff;
  color:#ffffff;
  font-size:7px;font-weight:900;letter-spacing:0;
  flex-shrink:0;
}
.dealer-spacer{width:13px;flex-shrink:0;visibility:hidden}

/* HCP badge — inside hand, bottom right */
.hcp-badge{
  position:absolute;
  bottom:7px;right:9px;
  background:rgba(200,151,58,0.18);
  color:var(--gold);
  font-size:10px;font-weight:700;
  padding:2px 6px;border-radius:5px;
  letter-spacing:0.3px;
  border:1px solid rgba(200,151,58,0.25);
}
.diag-col{display:flex;flex-direction:column;flex:1 1 0;min-width:0}
.diag-row-ns{display:flex;flex-direction:column;align-items:center}

/* SUIT ROWS */
.sr{display:flex;align-items:baseline;gap:5px;line-height:1.72;flex-wrap:nowrap;min-height:22px}
.sym{font-size:14px;width:18px;text-align:center;flex-shrink:0;line-height:1;display:inline-block}
.cds{font-size:13px;font-weight:700;font-family:-apple-system,'SF Pro Text',system-ui,sans-serif;word-spacing:2px;letter-spacing:0;white-space:nowrap;color:var(--txt)}
.vd{font-size:11px;color:var(--txt3);font-weight:400;line-height:1.72}
/* Lead card — circular white outline around the card value */
.lead-card{
  display:inline-block;
  background:#ffffff;
  color:#111111;
  border-radius:50%;
  width:1.15em;
  height:1.15em;
  line-height:1.15em;
  text-align:center;
  font-weight:900;
  font-family:inherit;
  font-size:0.95em;
  vertical-align:baseline;
  margin:0;
}

/* suit colours */
.cs{color:var(--suit-s)}.ch{color:var(--suit-h)}.cd{color:var(--suit-d)}.cc{color:var(--suit-c)}
.hs{color:var(--suit-s)}.hh{color:var(--suit-h)}.hd{color:var(--suit-d)}.hc{color:var(--suit-c)}

/* COMPASS */
.compass-cell{flex:0 0 44px;display:flex;align-items:center;justify-content:center}
.compass{
  width:38px;height:38px;position:relative;
  background:radial-gradient(circle at 35% 30%,rgba(255,255,255,.07),rgba(0,0,0,.4));
  border-radius:50%;
  border:1px solid rgba(200,151,58,.33);
  box-shadow:inset 0 2px 6px rgba(0,0,0,.3),0 2px 6px rgba(0,0,0,.25);
}
.compass::before{content:'';position:absolute;top:50%;left:6px;right:6px;height:1px;background:rgba(200,151,58,.28);transform:translateY(-50%)}
.compass::after {content:'';position:absolute;left:50%;top:6px;bottom:6px;width:1px;background:rgba(200,151,58,.28);transform:translateX(-50%)}
.cpt{position:absolute;color:rgba(255,255,255,.85);font-size:8px;font-weight:800}
.cpt-n{top:2px;left:50%;transform:translateX(-50%)}
.cpt-s{bottom:2px;left:50%;transform:translateX(-50%)}
.cpt-o{left:3px;top:50%;transform:translateY(-50%)}
.cpt-e{right:3px;top:50%;transform:translateY(-50%)}

/* ── SECTION CARD ── */
.sc{background:var(--card-bg);border:1px solid var(--card-bd);border-radius:var(--r);overflow:hidden;box-shadow:var(--sh-sm)}
.sc-body{padding:13px 11px}

/* ── AUCTION ── */
.auc-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
.auc-th{text-align:center;padding:7px 2px;border-radius:6px;font-size:10px;font-weight:700;letter-spacing:.5px;background:var(--felt-dk);color:rgba(255,255,255,.52)}
.auc-td{text-align:center;padding:6px 2px;border-radius:6px;min-height:34px;display:flex;align-items:center;justify-content:center;background:var(--cream);border:1px solid var(--card-bd);font-size:14px}
.bp{font-size:10px;color:var(--txt3);font-weight:600}
.bx{color:var(--red);font-weight:800;font-size:14px}
.bxx{color:var(--blue);font-weight:800;font-size:14px}
.c-h{color:var(--suit-h);font-weight:800}
.c-d{color:var(--suit-d);font-weight:800}
.c-s{color:var(--suit-s);font-weight:800}
.c-c{color:var(--suit-c);font-weight:800}
.b-sa{color:var(--txt);font-size:11px;font-weight:700}

/* ── COMMENT ── */
.cmt{border-left:3px solid var(--gold);padding:9px 13px;border-radius:0 8px 8px 0;background:var(--cream);font-size:14px;line-height:1.75;white-space:pre-wrap}

/* ── MISC ── */
.empty{padding:56px 22px;text-align:center}
.empty .ei{font-size:48px;margin-bottom:13px}
.empty h3{font-family:'Exo 2',sans-serif;font-size:18px;font-weight:700;margin-bottom:7px}
.empty p{font-size:14px;color:var(--txt2);line-height:1.6}
.loading{padding:44px;text-align:center;color:var(--txt2);font-size:14px}

/* ── SÉANCE GRID ── */
.seance-grid{display:flex;flex-direction:column;gap:8px;margin-bottom:4px}
.seance-card{background:rgba(0,0,0,.3);border:1px solid rgba(200,151,58,.22);border-radius:12px;padding:13px 16px;display:flex;flex-direction:row;align-items:center;justify-content:space-between;gap:10px;cursor:pointer;transition:border-color .15s,transform .1s;min-height:52px}
.seance-card.is-pressing{transform:scale(.95)}
.seance-desc{font-size:11px;color:rgba(200,151,58,.75);font-style:italic;margin-left:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex-shrink:1;min-width:0}
.seance-num{font-family:'Exo 2',sans-serif;font-size:15px;font-weight:800;color:#ffffff;letter-spacing:.5px;white-space:nowrap;flex-shrink:0}
.seance-count{font-size:11px;color:rgba(255,255,255,.4);flex-shrink:0}

/* ── IMAGES SECTION ── */
.images-section{padding:14px 18px 16px;background:#282828;border-bottom:1px solid rgba(200,151,58,.15)}
.images-label{font-size:10px;font-weight:600;color:rgba(255,255,255,.36);text-transform:uppercase;letter-spacing:1.2px;margin-bottom:10px}
.images-scroll{display:flex;gap:10px;overflow-x:auto;padding-bottom:6px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.images-scroll::-webkit-scrollbar{display:none}
.img-thumb{
  flex:0 0 auto;
  width:90px;height:90px;
  border-radius:10px;
  object-fit:cover;
  border:2px solid rgba(200,151,58,.3);
  cursor:pointer;
  transition:transform .12s,border-color .12s;
  box-shadow:var(--sh-sm);
}
.img-thumb.is-pressing{transform:scale(.93);border-color:rgba(200,151,58,.8)}

/* ── LIGHTBOX ── */
.lightbox{
  display:flex;
  position:fixed;inset:0;z-index:999;
  background:rgba(0,0,0,.95);
  flex-direction:column;
  align-items:center;justify-content:center;
  overflow:hidden;
  opacity:0;
  pointer-events:none;
  transition:opacity .5s ease;
  will-change:opacity;
  -webkit-transform:translateZ(0);
  transform:translateZ(0);
}
.lightbox.open{opacity:1;pointer-events:all}
.lightbox-track{
  display:flex;
  align-items:center;
  justify-content:center;
  width:100%;
  height:calc(100vh - 80px);
  position:relative;
}
.lightbox-img{
  position:absolute;
  max-width:100%;
  max-height:100%;
  object-fit:contain;
  border-radius:6px;
  box-shadow:0 8px 40px rgba(0,0,0,.7);
  transition:transform .3s cubic-bezier(.4,0,.2,1), opacity .3s;
  will-change:transform;
}
.lightbox-close{
  position:absolute;top:max(env(safe-area-inset-top,0px),14px);right:18px;
  width:38px;height:38px;border-radius:50%;
  background:rgba(255,255,255,.12);border:none;color:#fff;
  font-size:22px;cursor:pointer;display:flex;align-items:center;justify-content:center;
  transition:opacity .15s;
}
.lightbox-nav{
  position:absolute;top:50%;transform:translateY(-50%);
  width:48px;height:48px;border-radius:50%;
  background:rgba(255,255,255,.15);border:none;color:#fff;
  font-size:32px;cursor:pointer;display:flex;align-items:center;justify-content:center;
  transition:background .15s, opacity .15s;
  z-index:2;
}
.lightbox-nav:hover{background:rgba(255,255,255,.28)}
.lightbox-prev{left:16px}
.lightbox-next{right:16px}
.lightbox-name{
  position:absolute;bottom:max(env(safe-area-inset-bottom,0px),14px);left:0;right:0;
  text-align:center;font-size:12px;color:rgba(255,255,255,.45);padding:0 24px;
}

/* ── FILE LIST ANIMATIONS ── */
@keyframes fadeOut {
  from { opacity:1; }
  to   { opacity:0; }
}
@keyframes fadeIn {
  from { opacity:0; }
  to   { opacity:1; }
}

/* ── FADE OVERLAY ── */
#fade-overlay{
  position:fixed;inset:0;z-index:500;
  background:#0d1a10;
  pointer-events:none;
  opacity:0;
  transition:opacity .18s ease;
}
#fade-overlay.fade-in {opacity:1;pointer-events:all}

/* ── TOKEN ── */
.token-section{padding:10px 18px;background:#1a1a1a;border-top:1px solid rgba(200,151,58,.15);display:flex;align-items:center;gap:8px}
.token-wrap{flex:1;min-width:0;position:relative;display:flex;align-items:center}
.token-input{
  flex:1;min-width:0;width:100%;
  background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12);
  border-radius:8px;padding:8px 36px 8px 12px;color:#fff;font-size:12px;
  font-family:'Exo 2',sans-serif;outline:none;
}
.token-input::placeholder{color:rgba(255,255,255,.3)}
.token-input:focus{border-color:rgba(200,151,58,.5)}
.token-eye{
  position:absolute;right:8px;top:50%;transform:translateY(-50%);
  background:none;border:none;cursor:pointer;padding:2px;
  color:rgba(255,255,255,.4);font-size:15px;line-height:1;
  display:flex;align-items:center;justify-content:center;
}
.token-eye:hover{color:rgba(255,255,255,.8)}
.token-btn{
  padding:8px 12px;border-radius:8px;border:none;cursor:pointer;
  background:var(--felt);color:#fff;font-size:12px;font-weight:700;
  font-family:'Exo 2',sans-serif;white-space:nowrap;flex-shrink:0;
}
.token-ok{color:#6aaa78;font-size:16px;flex-shrink:0}
.btn-play{
  display:flex;align-items:center;gap:5px;
  padding:7px 11px;border-radius:8px;
  background:var(--felt);border:1.5px solid var(--felt-lt);
  color:#fff;font-size:12px;font-weight:700;
  font-family:'Exo 2',sans-serif;
  cursor:pointer;text-decoration:none;
  white-space:nowrap;flex-shrink:0;
  box-shadow:0 2px 6px rgba(0,0,0,.18);
  transition:filter .12s,transform .1s;
}
.btn-play.is-pressing{filter:brightness(.8);transform:scale(.94)}
</style>
</head>
<body>

<div id="splash">
  <div class="splash-logo"><span>Q</span><span>P</span><span>J</span><span>B</span></div>
  <div class="splash-title">Visualiseur de donnes</div>
  <div class="splash-dots"><span></span><span></span><span></span></div>
</div>

<div id="fade-overlay"></div>

<!-- HEADER FIXE PARTAGÉ -->

<script>
// ── constants ──────────────────────────────────────────────────────────
const SUITS  = ['S','H','D','C'];
const SYM    = {S:'♠',H:'♥',D:'♦',C:'♣'};
const SCLS   = {S:'cs',H:'ch',D:'cd',C:'cc'};
const DIR_FR = {N:'Nord',S:'Sud',E:'Est',W:'Ouest'};
// PBN clockwise: N→E→S→W
const CW = ['N','E','S','W'];


// ── state ──────────────────────────────────────────────────────────────
let deals = [], idx = 0;
let pbnFiles = [];
let playLinks = {}; // { "folder/file.pbn": "https://..." }
let descMap   = {}; // { "Séance X ...": "sous-titre" }
const pbnCache = {}; // url → decoded text

async function fetchPBN(url) {
  if (pbnCache[url]) return pbnCache[url];
  const buf = await (await fetch(url)).arrayBuffer();
  const bytes = new Uint8Array(buf);
  let text = new TextDecoder('utf-8').decode(bytes);
  if (text.includes('\uFFFD')) text = new TextDecoder('iso-8859-1').decode(bytes);
  pbnCache[url] = text;
  return text;
}


// ── helpers ────────────────────────────────────────────────────────────
const esc = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const _splashShown = Date.now();
const _SPLASH_MIN = 1500;
// Afficher le logo splash seulement quand Exo 2 est chargée
document.fonts.load('800 52px "Exo 2"').then(() => {
  const logo = document.querySelector('.splash-logo');
  if (logo) logo.style.opacity = '1';
});
function hideSplash() {
  const s = document.getElementById('splash');
  if (!s) return;
  const elapsed = Date.now() - _splashShown;
  const delay = Math.max(0, _SPLASH_MIN - elapsed);
  setTimeout(() => s.classList.add('fade-out'), delay);
}

function setHint(msg, err) {
  const h = document.getElementById('cfg-hint');
  h.textContent = msg;
  h.style.color = err ? '#f87171' : 'rgba(255,255,255,.26)';
}

// ── config ─────────────────────────────────────────────────────────────
const GH_REPO   = 'capgui13/QPJB';
const CACHE_KEY = 'qpjb-seances-v11';

function ghHeaders() {
  const token = localStorage.getItem('gh-token');
  const h = {Accept:'application/vnd.github.v3+json'};
  if (token) h.Authorization = `token ${token}`;
  return h;
}

function toggleTokenEye() {
  const input = document.getElementById('token-input');
  input.type = input.type === 'password' ? 'text' : 'password';
}

function saveToken() {
  const val = document.getElementById('token-input').value.trim();
  if (val) {
    localStorage.setItem('gh-token', val);
    document.getElementById('token-ok').style.display = 'inline';
    setTimeout(() => document.getElementById('token-ok').style.display = 'none', 2000);
    discoverSeances(true);
  }
}

function initTokenUI() {
  const token = localStorage.getItem('gh-token');
  if (token) {
    const input = document.getElementById('token-input');
    input.value = token;
    input.type = 'password';
    document.getElementById('token-ok').style.display = 'inline';
  }
}
let seancesData = null;

// ── helpers UI ─────────────────────────────────────────────────────────
// ── fondue rapide ─────────────────────────────────────────────────────
function fadeSwap(doSwap) {
  const ov = document.getElementById('fade-overlay');
  ov.classList.add('fade-in');
  setTimeout(() => {
    doSwap();
    requestAnimationFrame(() => requestAnimationFrame(() => {
      ov.classList.remove('fade-in');
    }));
  }, 190);
}

function renderSeanceGrid(seances) {
  const sorted = [...seances].sort((a,b) => a.folder.localeCompare(b.folder, 'fr'));
  const sc = document.getElementById('seances-count');
  if (sc) sc.textContent = '(' + seances.length + ')';
  const doRender = () => {
    document.getElementById('seance-grid').innerHTML = sorted.map(s => {
      const desc = descMap[s.folder] ? `<span class="seance-desc">— ${esc(descMap[s.folder])}</span>` : '';
      return `
      <div class="seance-card" data-folder="${esc(s.folder)}" onclick="loadSeance('${esc(s.folder)}')">
        <div class="seance-num" style="display:flex;align-items:baseline;min-width:0;overflow:hidden;flex:1">${esc(s.folder)}${desc}</div>
        <div class="seance-count" style="flex-shrink:0">${s.fichiers.length} donne${s.fichiers.length!==1?'s':''}</div>
      </div>`;
    }).join('');
  };

  if (Object.keys(descMap).length === 0) {
    // descMap vide : tenter de charger config.json (local ou GitHub raw)
    const urls = [
      './config.json',
      `https://raw.githubusercontent.com/${GH_REPO}/main/config.json`
    ];
    (async () => {
      for (const url of urls) {
        try {
          const r = await fetch(url);
          if (r.ok) { const cfg = await r.json(); descMap = cfg.descriptions || {}; playLinks = cfg.links || playLinks; break; }
        } catch {}
      }
      doRender();
    })();
  } else {
    doRender();
  }
}

// ── découverte auto — cache invalidé par SHA de commit ─────────────────
async function discoverSeances(forceRefresh = false) {
  const grid = document.getElementById('seance-grid');
  grid.innerHTML = '<div class="loading" style="color:rgba(255,255,255,.4);padding:8px 0">Recherche…</div>';
  try {
    const commitRes = await fetch(
      `https://api.github.com/repos/${GH_REPO}/commits?per_page=1`,
      {headers:ghHeaders()});
    if (!commitRes.ok) {
      if (commitRes.status === 403) throw new Error('Limite API GitHub atteinte — réessaie dans une heure');
      throw new Error(`Repo introuvable (${commitRes.status})`);
    }
    const commitData = await commitRes.json();
    const currentSha = commitData[0]?.sha || null;

    if (!forceRefresh) {
      try {
        const cached = JSON.parse(localStorage.getItem(CACHE_KEY) || 'null');
        if (cached && cached.sha === currentSha && cached.seances?.length) {
          seancesData = { seances: cached.seances };
          renderSeanceGrid(cached.seances);
          if (cached.images?.length) renderImages(cached.images);
          if (cached.playLinks) playLinks = cached.playLinks;
          if (cached.descMap)   descMap   = cached.descMap;
          setHint('');
          hideSplash();
          return;
        }
      } catch {}
    }

    const contentsRes = await fetch(
      `https://api.github.com/repos/${GH_REPO}/contents/`,
      {headers:ghHeaders()});
    if (!contentsRes.ok) throw new Error(`Erreur chargement (${contentsRes.status})`);
    const items = await contentsRes.json();

    // ── images dans le dossier Docs ────────────────────────────────────
    const IMAGE_EXT = /\.(jpe?g|png|gif|webp|svg)$/i;
    const docsFolder = items.find(f => f.type === 'dir' && f.name === 'Docs');
    let rootImages = [];
    if (docsFolder) {
      try {
        const docsRes = await fetch(
          `https://api.github.com/repos/${GH_REPO}/contents/Docs`,
          { headers: ghHeaders() }
        );
        if (docsRes.ok) {
          const docsItems = await docsRes.json();
          rootImages = docsItems
            .filter(f => f.type === 'file' && IMAGE_EXT.test(f.name))
            .map(f => ({ name: f.name, url: f.download_url }));
          if (rootImages.length) renderImages(rootImages);
        }
      } catch {}
    }

    // ── config.json : liens "jouer" ─────────────────────────────────────
    // Fallback local (pour tests en file://)
    try {
      const localCfg = await fetch('./config.json');
      if (localCfg.ok) {
        const cfg = await localCfg.json();
        playLinks = cfg.links || {};
        descMap   = cfg.descriptions || {};
      }
    } catch {}

    const configItem = items.find(f => f.type === 'file' && f.name === 'config.json');
    if (configItem) {
      try {
        const cfgRes = await fetch(configItem.download_url);
        if (cfgRes.ok) {
          const cfg = await cfgRes.json();
          playLinks = cfg.links || {};
          descMap   = cfg.descriptions || {};
        }
      } catch {}
    }

    const folders = items.filter(f => f.type === 'dir');
    if (!folders.length) {
      grid.innerHTML = '<div style="color:rgba(255,255,255,.35);font-size:13px;padding:8px 0">Aucun dossier trouvé.</div>';
      return;
    }

    const results = await Promise.all(folders.map(async folder => {
      try {
        const res = await fetch(
          `https://api.github.com/repos/${GH_REPO}/contents/${encodeURIComponent(folder.name)}`,
          {headers:ghHeaders()});
        if (!res.ok) return null;
        const files = await res.json();
        const fichiers = files
          .filter(f => f.type === 'file' && /\.pbn$/i.test(f.name))
          .map(f => ({name: f.name, download_url: f.download_url}));
        return fichiers.length ? { folder: folder.name, fichiers } : null;
      } catch { return null; }
    }));

    const found = results.filter(Boolean);
    if (!found.length) {
      grid.innerHTML = '<div style="color:rgba(255,255,255,.35);font-size:13px;padding:8px 0">Aucun fichier PBN trouvé.</div>';
      return;
    }

    try { localStorage.setItem(CACHE_KEY, JSON.stringify({ sha: currentSha, ts: Date.now(), seances: found, images: rootImages, playLinks, descMap })); } catch {}
    seancesData = { seances: found };
    renderSeanceGrid(found);
    setHint('');
    hideSplash();

  } catch(e) {
    // Essayer le cache périmé en fallback
    try {
      const cached = JSON.parse(localStorage.getItem(CACHE_KEY) || 'null');
      if (cached?.seances?.length) {
        seancesData = { seances: cached.seances };
        renderSeanceGrid(cached.seances);
        if (cached.images?.length) renderImages(cached.images);
        if (cached.playLinks) playLinks = cached.playLinks;
        if (cached.descMap)   descMap   = cached.descMap;
        // Tenter de rafraîchir le config local (descriptions, liens)
        try {
          const localCfg = await fetch('./config.json');
          if (localCfg.ok) { const cfg = await localCfg.json(); playLinks = cfg.links || playLinks; descMap = cfg.descriptions || descMap; }
        } catch {}
        renderSeanceGrid(cached.seances); // re-render avec descMap à jour
        hideSplash();
        return;
      }
    } catch {}
    // Aucun cache — afficher l'erreur
    const msg = e?.message || String(e) || 'Erreur inconnue';
    grid.innerHTML = `<div style="color:#f87171;font-size:13px;padding:8px 0">⚠️ ${esc(msg)}</div>`;
    hideSplash();
  }
}
// ── affichage des images de la racine ──────────────────────────────────
let lightboxImages = [];
let lightboxIdx = 0;

function renderImages(images) {
  lightboxImages = images;
  const section = document.getElementById('images-section');
  const scroll  = document.getElementById('images-scroll');
  scroll.innerHTML = images.map((img, i) =>
    `<img class="img-thumb" src="${esc(img.url)}" alt="${esc(img.name)}"
          loading="lazy" onclick="openLightbox(${i})">`
  ).join('');
  section.style.display = 'block';
  const dc = document.getElementById('docs-count');
  if (dc) dc.textContent = '(' + images.length + ')';
}

// ── lightbox ───────────────────────────────────────────────────────────
function imgA() { return document.getElementById('lightbox-img-a'); }
function imgB() { return document.getElementById('lightbox-img-b'); }

function lbUpdate(idx) {
  document.getElementById('lightbox-name').textContent = lightboxImages[idx].name;
  document.getElementById('lightbox-prev').style.visibility = idx > 0 ? 'visible' : 'hidden';
  document.getElementById('lightbox-next').style.visibility = idx < lightboxImages.length-1 ? 'visible' : 'hidden';
}

function resetSlots() {
  const a = imgA(), b = imgB();
  a.style.transition = 'none'; a.style.transform = ''; a.style.opacity = '1';
  b.style.transition = 'none'; b.style.transform = ''; b.style.opacity = '0'; b.src = '';
}

let _openTimer = null;
function openLightbox(i) {
  lightboxIdx = i;
  resetSlots();
  imgA().src = lightboxImages[i].url;
  lbUpdate(i);
  const _lb = document.getElementById('lightbox');
  void _lb.offsetWidth;
  _lb.classList.add('open');
  document.body.style.overflow = 'hidden';
}

let _lbBusy = false;
function navLightbox(dir) {
  if (_lbBusy) return;
  const next = lightboxIdx + dir;
  if (next < 0 || next >= lightboxImages.length) return;
  if (_openTimer) { clearTimeout(_openTimer); _openTimer = null; imgA().style.transition = ''; }
  _lbBusy = true;
  const a = imgA(), b = imgB();
  b.src = lightboxImages[next].url;
  b.style.transition = 'none';
  b.style.transform = 'translateX(0)';
  b.style.opacity = '0';
  void b.offsetWidth;
  a.style.transition = 'opacity .5s ease';
  a.style.opacity = '0';
  setTimeout(() => {
    lightboxIdx = next;
    lbUpdate(next);
    resetSlots();
    imgA().src = lightboxImages[next].url;
    imgA().style.transition = 'none';
    imgA().style.opacity = '0';
    void imgA().offsetWidth;
    imgA().style.transition = 'opacity .5s ease';
    imgA().style.opacity = '1';
    _lbBusy = false;
  }, 520);
}

function closeLightbox(e) {
  if (e && e.target !== e.currentTarget && !e.target.classList.contains('lightbox-close')) return;
  const lb = document.getElementById('lightbox');
  lb.classList.remove('open');
  setTimeout(() => {
    imgA().src = ''; imgB().src = '';
    resetSlots();
    imgA().style.opacity = '';
    imgA().style.transform = '';
    imgA().style.transition = '';
    document.querySelectorAll('.lightbox-nav, .lightbox-close').forEach(n => n.style.opacity = '');
    document.body.style.overflow = '';
  }, 230);
}

// ── swipe sur la lightbox ──────────────────────────────────────────────
(function() {
  let tx = 0, ty = 0, tt = 0, dragging = false, swipeDir = null;
  const lb   = () => document.getElementById('lightbox');
  const navs = () => document.querySelectorAll('.lightbox-nav, .lightbox-close');
  const W    = () => window.innerWidth;

  function showNavs(v) { navs().forEach(n => n.style.opacity = v ? '1' : '0'); }

  document.addEventListener('touchstart', e => {
    if (!lb().classList.contains('open')) return;
    tx = e.touches[0].clientX;
    ty = e.touches[0].clientY;
    tt = Date.now();
    dragging = true; swipeDir = null;
    imgA().style.transition = 'none';
    imgB().style.transition = 'none';
  }, {passive:true});

  document.addEventListener('touchmove', e => {
    if (!dragging || !lb().classList.contains('open')) return;
    const dx = e.touches[0].clientX - tx;
    const dy = e.touches[0].clientY - ty;
    if (!swipeDir && Math.max(Math.abs(dx), Math.abs(dy)) > 10) {
      swipeDir = Math.abs(dx) >= Math.abs(dy) ? 'h' : 'v';
      showNavs(false);
      if (swipeDir === 'h') {
        const ni = lightboxIdx + (dx < 0 ? 1 : -1);
        if (ni >= 0 && ni < lightboxImages.length) {
          imgB().src = lightboxImages[ni].url;
          imgB().style.opacity = '1';
          imgB().style.transform = `translateX(${dx < 0 ? W() : -W()}px)`;
        }
      }
    }
    if (!swipeDir) return;
    e.preventDefault();
    if (swipeDir === 'h') {
      imgA().style.transform = `translateX(${dx}px)`;
      const ni = lightboxIdx + (dx < 0 ? 1 : -1);
      if (ni >= 0 && ni < lightboxImages.length) {
        imgB().style.transform = `translateX(${dx + (dx < 0 ? W() : -W())}px)`;
      }
    } else {
      // iOS style : l'image suit le doigt, rétrécit, le fond se transparentise
      const clampedDy = Math.max(0, dy);
      const progress = Math.min(clampedDy / (window.innerHeight * 0.6), 1);
      const scale = 1 - progress * 0.25;
      imgA().style.transform = `translateY(${clampedDy}px) scale(${scale})`;
      lb().style.background = `rgba(0,0,0,${0.95 * (1 - progress)})`;
    }
  }, {passive:false});

  document.addEventListener('touchend', e => {
    if (!dragging || !lb().classList.contains('open')) return;
    dragging = false;
    const dx = e.changedTouches[0].clientX - tx;
    const dy = e.changedTouches[0].clientY - ty;
    const dt = Date.now() - tt;

    if (swipeDir === 'v') {
      const vy = dy / dt;
      if (dy > 80 || vy > 0.4) {
        // Fermeture : l'image glisse vers le bas, le fond disparaît
        imgA().style.transition = 'transform .35s ease, opacity .35s ease';
        imgA().style.transform  = `translateY(${window.innerHeight}px) scale(0.8)`;
        imgA().style.opacity    = '0';
        lb().style.transition   = 'background .35s ease';
        lb().style.background   = 'rgba(0,0,0,0)';
        setTimeout(() => {
          // Retirer .open sans flash : on garde opacity:0 inline le temps du nettoyage
          lb().style.transition = 'none';
          lb().style.opacity = '0';
          lb().style.background = 'rgba(0,0,0,0)';
          lb().classList.remove('open');
          imgA().src = ''; imgB().src = '';
          resetSlots();
          imgA().style.opacity = '';
          imgA().style.transform = '';
          imgA().style.transition = '';
          // Nettoyer les styles inline au prochain frame, une fois .open retiré
          requestAnimationFrame(() => {
            lb().style.transition = '';
            lb().style.opacity = '';
            lb().style.background = '';
          });
          document.querySelectorAll('.lightbox-nav, .lightbox-close').forEach(n => n.style.opacity = '');
          document.body.style.overflow = '';
        }, 350);
      } else {
        // Annulation : retour en place
        imgA().style.transition = 'transform .3s ease';
        imgA().style.transform  = '';
        lb().style.transition   = 'background .3s ease';
        lb().style.background   = '';
        setTimeout(() => { lb().style.transition = ''; showNavs(true); }, 300);
      }
      return;
    }

    if (swipeDir === 'h') {
      const nextIdx = lightboxIdx + (dx < 0 ? 1 : -1);
      const velocity = Math.abs(dx) / dt;
      const committed = nextIdx >= 0 && nextIdx < lightboxImages.length &&
        (Math.abs(dx) > W() / 3 || velocity > 0.3);
      if (committed) {
        imgA().style.transition = 'transform .25s ease';
        imgA().style.transform  = `translateX(${dx < 0 ? -W() : W()}px)`;
        imgB().style.transition = 'transform .25s ease';
        imgB().style.transform  = 'translateX(0)';
        showNavs(false);
        setTimeout(() => {
          lightboxIdx = nextIdx;
          imgA().src = lightboxImages[nextIdx].url;
          lbUpdate(nextIdx);
          resetSlots();
          showNavs(true);
        }, 260);
      } else {
        imgA().style.transition = 'transform .3s ease';
        imgA().style.transform  = '';
        imgB().style.transition = 'transform .3s ease';
        imgB().style.transform  = `translateX(${dx < 0 ? W() : -W()}px)`;
        setTimeout(() => {
          imgB().style.transition='none'; imgB().style.opacity='0'; imgB().src='';
          showNavs(true);
        }, 300);
      }
    }
  }, {passive:true});
})();

// ── ouverture d'un dossier → vue séance ───────────────────────────────
let currentFolder = null;

function loadSeance(folderName) {
  const seance = (seancesData?.seances || []).find(s => s.folder === folderName);
  if (!seance) return;

  fadeSwap(() => {
    currentFolder = folderName;
    pbnFiles = seance.fichiers;

    // Titre dans la barre de nav
    const desc = descMap[folderName];
    const titleEl = document.getElementById('seance-nav-title');
    titleEl.innerHTML = `<div style="display:flex;flex-direction:column;align-items:center;gap:1px">
      <span>${esc(folderName)}</span>
      ${desc ? `<span style="font-style:italic;opacity:.85;font-size:12px;font-weight:400;color:rgba(200,151,58,1)">${esc(desc)}</span>` : ''}
    </div>`;

    // Injecter la liste des PBNs
    document.getElementById('seance-file-list').innerHTML = buildFileListHtml(folderName);
    document.getElementById('seance-file-list').classList.remove('blur-disabled');
    const toggleInput = document.getElementById('blur-toggle-input');
    if (toggleInput) toggleInput.checked = true;

    // Basculer les vues

// Ouvre la séance en commençant à la première donne du fichier fileIdx
// Charge tous les PBN en parallèle et aplatit toutes les donnes en une seule liste
async function openSeanceAt(fileIdx) {
  await showDeal();
  try {
    const texts = await Promise.all(pbnFiles.map(f => fetchPBN(f.download_url)));
    deals = [];
    let startIdx = 0;
    texts.forEach((text, fi) => {
      const displayName = pbnFiles[fi].name.replace(/\.pbn$/i, '');
      const f = pbnFiles[fi];
      const key = `${currentFolder}/${f.name}`;
      const baseName = f.name.replace(/\.pbn$/i, '');
      const shortKey = `${currentFolder}/${baseName.split(' - ')[0].trim()}`;
      const link = playLinks[key] || playLinks[shortKey] || playLinks[f.name] || '';
      const parsed = parsePBN(text);
      parsed.forEach(d => { d._filename = displayName; d._playLink = link; });
      if (fi === fileIdx) startIdx = deals.length;
      deals = deals.concat(parsed);
    });
    if (!deals.length) { showErr('Aucune donne trouvée.'); return; }
    idx = startIdx;
    render(idx);
    window.scrollTo(0, 0);
  } catch(e) { showErr(e.message); }
}

// ── PBN parser ─────────────────────────────────────────────────────────
function parsePBN(text) {
  const out = [];
  const normalized = text
    .replace(/^\uFEFF/, '')
    .replace(/\r\n/g, '\n').replace(/\r/g, '\n')
    .replace(/\\n/g, '\n'); // literal \n sequences in PBN comments

  // Strategy: first extract all { } comment blocks (can span multiple lines),
  // then process the remaining text line by line.
  let cleanText = '', commentList = [];
  let ci = 0;
  while (ci < normalized.length) {
    const ob = normalized.indexOf('{', ci);
    if (ob < 0) { cleanText += normalized.slice(ci); break; }
    cleanText += normalized.slice(ci, ob);
    const cb = normalized.indexOf('}', ob);
    if (cb < 0) { break; } // unclosed comment — stop
    commentList.push(normalized.slice(ob+1, cb).trim());
    cleanText += '\uFFFD'; // placeholder so line structure is preserved
    ci = cb + 1;
  }

  let comIdx = 0;
  const lines = cleanText.split('\n');
  let cur = null, coms = [], mode = null;

  const flush = () => {
    if (cur && cur.Deal) {
      if (coms.length) cur.Comment = coms.join('\n').trim();
      out.push({...cur});
    }
    cur = null; coms = []; mode = null;
  };

  for (let raw of lines) {
    // Replace comment placeholders
    const hadPlaceholder = raw.includes('\uFFFD');
    let line = raw.replace(/\uFFFD/g, () => {
      const c = commentList[comIdx++] || '';
      if (c) coms.push(c);
      return '';
    }).trim();

    // Skip % directives
    if (line.startsWith('%')) continue;

    // Blank line = end of deal — but NOT if it was just a comment placeholder
    if (!line) {
      if (!hadPlaceholder) flush();
      continue;
    }

    // Tag line: [Key "Value"]
    const tm = line.match(/^\[(\w+)\s+"(.*)"\]$/);
    if (tm) {
      const [, k, v] = tm;
      if (!cur) cur = {};
      if (k === 'Auction') {
        cur.AuctionFirst = v;
        cur.Auction = '';
        mode = 'auction';
      } else if (k === 'Play') {
        cur.PlayFirst = v; // direction of lead
        mode = 'play';
        cur.Lead = null; // will be set from first play line
      } else if (k === 'Note') {
        mode = null;
        cur.Note = cur.Note ? cur.Note + '\n' + v : v;
      } else {
        mode = null;
        cur[k] = v;
      }
      continue;
    }

    // Data lines after Auction
    if (mode === 'auction' && cur) {
      const bids = line.split(/\s+/).filter(Boolean);
      cur.Auction = (cur.Auction ? cur.Auction + ' ' : '') + bids.join(' ');
    }
    // First play line = lead card
    if (mode === 'play' && cur && !cur.Lead) {
      const first = line.trim().split(/\s+/)[0];
      if (first && /^[SHDC][A-Z0-9T]+$/i.test(first)) cur.Lead = first.toUpperCase();
    }
  }
  flush();
  return out;
}

// ── deal string parser ─────────────────────────────────────────────────
// PBN spec: "first:h0 h1 h2 h3" clockwise N→E→S→W
// Each hand: "S.H.D.C", void suit = '-' or ''
function parseDeal(str) {
  if (!str) return null;
  const m = str.match(/^([NSEWnsew]):(.+)$/);
  if (!m) return null;
  const first = m[1].toUpperCase();
  const si = CW.indexOf(first);
  if (si < 0) return null;
  const dirs = [0,1,2,3].map(i => CW[(si+i)%4]);
  const res = {};
  m[2].trim().split(/\s+/).forEach((h, i) => {
    if (i > 3) return;
    const p = h.split('.');
    while (p.length < 4) p.push('');
    res[dirs[i]] = {
      S: p[0]==='-' ? '' : p[0],
      H: p[1]==='-' ? '' : p[1],
      D: p[2]==='-' ? '' : p[2],
      C: p[3]==='-' ? '' : p[3],
    };
  });
  return res;
}

// ── déduire contrat et déclarant depuis la séquence d'enchères ─────────
function inferContractFromAuction(auctionStr, auctionFirst) {
  if (!auctionStr || !auctionFirst) return null;

  const BASE = ['W','N','E','S'];
  const startIdx = BASE.indexOf(auctionFirst.toUpperCase());
  if (startIdx < 0) return null;

  const bids = auctionStr.trim().split(/\s+/).filter(b => b && b.toUpperCase() !== 'AP');

  // Associer chaque enchère à son joueur
  const bidsByPlayer = bids.map((bid, i) => ({
    bid: bid.toUpperCase(),
    dir: BASE[(startIdx + i) % 4]
  }));

  // Trouver la dernière enchère de couleur/SA (hors P/X/XX)
  const CONTRACT_RE = /^([1-7])(S|H|D|C|NT|N)(X{0,2})$/i;
  let lastContract = null;
  for (const b of bidsByPlayer) {
    if (CONTRACT_RE.test(b.bid)) lastContract = b;
  }
  if (!lastContract) return null; // séquence passée ou invalide

  const m = lastContract.bid.match(CONTRACT_RE);
  const level = m[1];
  const suit  = m[2].toUpperCase() === 'N' ? 'NT' : m[2].toUpperCase();
  const dbl   = m[3] || '';
  const contract = `${level}${suit}${dbl}`;

  // Camp du joueur qui a dit le contrat final
  const declDir = lastContract.dir;
  const NS = ['N','S'], EW = ['E','W'];
  const partnerDirs = NS.includes(declDir) ? NS : EW;

  // Premier joueur du camp à avoir annoncé cette couleur/SA
  const suitKey = suit === 'NT' ? 'NT' : suit; // N et NT normalisés
  let declarer = declDir; // par défaut
  for (const b of bidsByPlayer) {
    if (!partnerDirs.includes(b.dir)) continue;
    const bm = b.bid.match(CONTRACT_RE);
    if (!bm) continue;
    const bs = bm[2].toUpperCase() === 'N' ? 'NT' : bm[2].toUpperCase();
    if (bs === suitKey) { declarer = b.dir; break; }
  }

  return { contract, declarer };
}

// ── render deal ────────────────────────────────────────────────────────
function render(i) {
  const d = deals[i], total = deals.length;
  idx = i;
  updateNavCounter();

  const dealer  = d.Dealer || '?';
  const vul     = d.Vulnerable || 'None';
  const hands   = parseDeal(d.Deal || '');
  const auction = (d.Auction || '').trim();
  const auctionFirst = d.AuctionFirst || dealer;
  const comment = (d.Comment || d.Note || '').trim();
  let lead = d.Lead || '';
  // Inférer l'entame depuis le commentaire si absente du PBN
  if (!lead && comment) {
    const SUIT_MAP = {'P':'S','C':'H','K':'D','T':'C'};
    const PAT_LET  = /([ARDVX2-9]{1,2})([PCKT])/;
    for (const line of comment.split('\n')) {
      if (/entame/i.test(line)) {
        const m = line.match(PAT_LET);
        if (m) {
          lead = SUIT_MAP[m[2]] + m[1].toUpperCase().replace('X','T');
          break;
        }
      }
    }
  }

  // Contrat et déclarant : depuis le PBN, ou déduits des enchères
  let contract = d.Contract || '';
  let declarer = d.Declarer || '';
  if ((!contract || !declarer) && auction && auction !== '?') {
    const inferred = inferContractFromAuction(auction, auctionFirst);
    if (inferred) {
      if (!contract) contract = inferred.contract;
      if (!declarer) declarer = inferred.declarer;
    }
  }

  const vulLabel = {None:'Vul. Pers.', NS:'Vul. N-S', EW:'Vul. E-O', All:'Vul. Tous'}[vul] || vul;
  const vulCls   = vul === 'None' ? 'badge-nov' : 'badge-vul';

  let html = `
    <div class="board-hdr">
      <div class="board-num">${esc(d._filename || String(d.Board||i+1))}</div>
      <div class="board-badges">
        <span class="badge badge-dealer">Donneur : ${esc(DIR_FR[dealer]||dealer)}</span>
        <span class="badge badge-vul-box ${vulCls}">${esc(vulLabel)}</span>
        ${contract ? `<span class="badge badge-contract">${fmtContract(contract, declarer)}</span>` : ''}
      </div>
    </div>
    <div class="diag-card">
      ${d._playLink ? `<a class="btn-play-diag" href="${esc(d._playLink)}" target="_blank" rel="noopener">▶ Jouer</a>` : ''}
      ${renderDiag(hands, lead, d.PlayFirst || (declarer ? (['N','E','S','W'][(['N','E','S','W'].indexOf(declarer.toUpperCase())+1)%4]) : null), dealer, vul)}
    </div>`;

  if (auction && auction !== '?')
    html += `<div class="sc"><div class="sc-body">${renderAuction(auctionFirst, auction)}</div></div>`;

  if (comment) {
    const paras = comment.split(/\n\s*\n/).map(p =>
      p.split('\n').map(l => l.trim()).filter(Boolean).join(' ')
    ).filter(Boolean);
    const cmtHtml = paras.map(p => `<p style="margin:0 0 10px">${fmtComment(p)}</p>`).join('');
    html += `<div class="sc"><div class="sc-body"><div class="cmt" style="white-space:normal;line-height:1.7">${cmtHtml}</div></div></div>`;
  }

  document.getElementById('deal-content').innerHTML = html;

  // Réduire la police du nom si trop long
  const boardNum = document.querySelector('.board-num');
  if (boardNum) {
    let fs = 12;
    boardNum.style.fontSize = fs + 'px';
    const maxH = parseFloat(getComputedStyle(boardNum).lineHeight) * 2;
    while (boardNum.scrollHeight > maxH + 2 && fs > 7) {
      fs -= 0.5;
      boardNum.style.fontSize = fs + 'px';
    }
  }
}

// ── format comment — replace suit codes with symbols ───────────────────
function fmtComment(text) {
  // French bridge: P=♠ C=♥ K=♦ T=♣
  const MAP = {'P':['♠','cs'], 'C':['♥','ch'], 'K':['♦','cd'], 'T':['♣','cc']};

  // Is character a unicode letter?
  const isLetter = c => c && /\p{L}/u.test(c);
  // Is character a "word boundary" that should block suit detection:
  // letters AND apostrophes (', ') which attach to words like "c'est", "d'un"
  const isWordChar = c => c && (/\p{L}/u.test(c) || c === "'" || c === '\u2019');

  // Prefix = one or more card tokens: A R D V 10 X 2-9 (French notation)
  // We capture the full sequence greedily (e.g. "ARD" in "ARDC")
  const re = /((?:10|[ARDVXardvx2-9])*)([PCKTpckt])/g;

  const converted = text.replace(re, (match, prefix, suit, offset, src) => {
    const s = suit.toUpperCase();
    if (!MAP[s]) return match;

    const charBefore = src[offset - 1];           // char just before the whole match
    const charAfter  = src[offset + match.length]; // char just after the whole match

    // Skip if suit letter is followed by a letter → part of a word ("course", "technique")
    if (isLetter(charAfter)) return match;

    if (!prefix) {
      // Bare suit letter: skip if preceded OR followed by a word character (letter or apostrophe)
      // "c'est" → c is followed by ', "l'As" → s preceded by '
      if (isWordChar(charBefore) || isWordChar(charAfter)) return match;
    } else {
      // Has a card prefix (e.g. "ARD" in "ARDC"): skip if char before prefix is a letter
      if (isLetter(src[offset - 1])) return match;
    }

    const [sym, cls] = MAP[s];
    // Render each card token individually, then the suit symbol
    const cardTokens = prefix
      ? prefix.replace(/10|[ARDVXardvx2-9]/g, tok => esc(tok))
      : '';
    return cardTokens + `\x00${cls}\x01${sym}\x02`;
  });

  return esc(converted)
    .replace(/\x00([a-z-]+)\x01([^\x02]*)\x02/g,
      (_, cls, sym) => `<span class="${cls}">${sym}</span>`);
}
function fmtContract(contract, declarer) {
  if (!contract || contract === '?' || contract === 'Pass') return esc(contract);
  const m = contract.match(/^([1-7])(S|H|D|C|NT|N)(X{0,2})$/i);
  if (!m) return esc(contract);
  const suitUp = m[2].toUpperCase();
  const symMap = {S:'♠', H:'♥', D:'♦', C:'♣', NT:'SA', N:'SA'};
  const clsMap = {S:'cs', H:'ch', D:'cd', C:'cc'};
  const sym = symMap[suitUp] || suitUp;
  const cls = clsMap[suitUp] || '';
  const dbl  = m[3] ? ` ${m[3]}` : '';
  const decl = declarer ? ` par ${DIR_FR[declarer.toUpperCase()]||declarer}` : '';
  const suitSpan = cls ? `<span class="${cls}">${sym}</span>` : sym;
  return `${m[1]}${suitSpan}${dbl}${decl}`;
}

// ── format lead for badge (suit in correct color) ─────────────────────

// ── HCP calculator ─────────────────────────────────────────────────────
function calcHCP(hand) {
  if (!hand) return 0;
  let pts = 0;
  for (const suit of SUITS) {
    const s = (hand[suit] || '').toUpperCase();
    for (let i = 0; i < s.length; i++) {
      if (s[i]==='A') pts += 4;
      else if (s[i]==='K') pts += 3;
      else if (s[i]==='Q') pts += 2;
      else if (s[i]==='J') pts += 1;
    }
  }
  return pts;
}

// ── render hand — returns {suits, hcp} ────────────────────────────────
function renderHand(hand, leadInfo) {
  if (!hand) return { suits: '<div class="vd">—</div>', hcp: 0 };
  const hcp = calcHCP(hand);
  const suits = SUITS.map(s => {
    const raw = hand[s] || '';
    const k = SCLS[s];
    if (!raw || raw === '-') {
      return `<div class="sr"><span class="sym ${k}">${SYM[s]}</span><span class="vd">—</span></div>`;
    }
    const tokens = [];
    for (let i = 0; i < raw.length; i++) {
      const c = raw[i];
      let fr;
      if      (c==='A') fr='A';
      else if (c==='K') fr='R';
      else if (c==='Q') fr='D';
      else if (c==='J') fr='V';
      else if (c==='T') fr='10';
      else if (c==='1'&&raw[i+1]==='0') { fr='10'; i++; }
      else fr=c;
      const isLead = leadInfo && s === leadInfo.suit && c === leadInfo.card;
      tokens.push(isLead ? `<span class="lead-card">${fr}</span>` : fr);
    }
    return `<div class="sr"><span class="sym ${k}">${SYM[s]}</span><span class="cds">${tokens.join(' ')}</span></div>`;
  }).join('');
  return { suits, hcp };
}

// ── render diagram ─────────────────────────────────────────────────────
function renderDiag(hands, lead, playFirst, dealer, vul) {
  const h = hands || {};

  const vulDirs = {'None':[],'NS':['N','S'],'EW':['E','W'],'All':['N','S','E','W']}[vul]||[];
  const lblClass = dir => vulDirs.includes(dir) ? 'lbl-vul' : 'lbl-nov';
  const lblName  = {N:'Nord', S:'Sud', E:'Est', W:'Ouest'};

  const handLbl = dir => {
    const isDealer = dealer && dir === dealer.toUpperCase();
    const cls = lblClass(dir);
    return `<div class="hand-lbl ${cls}">
      <span class="dealer-spacer"></span>
      ${lblName[dir]}
      ${isDealer ? '<span class="dealer-badge">D</span>' : '<span class="dealer-spacer"></span>'}
    </div>`;
  };

  let leadInfo = null;
  if (lead && lead.length >= 2 && playFirst) {
    const FR_TO_PBN = {'V':'J','D':'Q','R':'K','X':'T'};
    const rawCard = lead[1].toUpperCase();
    leadInfo = { dir: playFirst.toUpperCase(), suit: lead[0].toUpperCase(), card: FR_TO_PBN[rawCard] || rawCard };
  }
  const rh = (dir, hand) => renderHand(hand, leadInfo && leadInfo.dir === dir ? leadInfo : null);

  const handBox = (dir, hand, ns) => {
    const {suits, hcp} = rh(dir, hand);
    const cls = ns ? 'hand hand-ns' : 'hand';
    return `<div class="${cls}">${handLbl(dir)}${suits}<div class="hcp-badge">${hcp} H</div></div>`;
  };

  return `<div class="diag-grid">
    <div class="diag-row diag-row-ns">${handBox('N', h.N, true)}</div>
    <div class="diag-row">
      <div class="diag-col">${handBox('W', h.W, false)}</div>
      <div class="compass-cell"><div class="compass">
        <span class="cpt cpt-n">N</span><span class="cpt cpt-s">S</span>
        <span class="cpt cpt-o">O</span><span class="cpt cpt-e">E</span>
      </div></div>
      <div class="diag-col">${handBox('E', h.E, false)}</div>
    </div>
    <div class="diag-row diag-row-ns">${handBox('S', h.S, true)}</div>
  </div>`;
}

// ── render auction ─────────────────────────────────────────────────────
function renderAuction(firstBidder, str) {
  const BASE   = ['W','N','E','S'];
  const LABELS = {W:'Ouest',N:'Nord',E:'Est',S:'Sud'};
  const bids   = str.split(/\s+/).filter(b => b && b.toUpperCase() !== 'AP');

  // Rotate columns so first bidder is always the leftmost column
  const startIdx = BASE.indexOf((firstBidder||'').toUpperCase());
  const ORDER = [0,1,2,3].map(i => BASE[(startIdx + i) % 4]);

  let html = ORDER.map(d => `<div class="auc-th">${LABELS[d]}</div>`).join('');
  // First bidder is now column 0, so no offset needed
  bids.forEach(b => { html += `<div class="auc-td">${fmtBid(b)}</div>`; });
  const rem = (4 - (bids.length % 4)) % 4;
  for (let i=0; i<rem; i++) html += '<div class="auc-td"></div>';
  return `<div class="auc-grid">${html}</div>`;
}

// ── format one bid ─────────────────────────────────────────────────────
function fmtBid(bid) {
  if (!bid) return '';
  const b = bid.toUpperCase();
  if (b==='PASS'||b==='P')          return '<span class="bp">Passe</span>';
  if (b==='X'||b==='DBL'||b==='D') return '<span class="bx">X</span>';
  if (b==='XX'||b==='RDBL'||b==='R')return '<span class="bxx">XX</span>';
  if (b==='AP')                     return '';
  const m = b.match(/^([1-7])(S|H|D|C|NT|N)$/);
  if (m) {
    const sym = {S:'♠',H:'♥',D:'♦',C:'♣',NT:'SA',N:'SA'}[m[2]];
    const cls = {S:'c-s',H:'c-h',D:'c-d',C:'c-c'}[m[2]] || 'b-sa';
    return `<strong>${m[1]}</strong><span class="${cls}">${sym}</span>`;
  }
  return esc(bid);
}

// ── navigation clavier ────────────────────────────────────────────────
document.addEventListener('keydown', e => {
  const lightboxOpen = document.getElementById('lightbox').classList.contains('open');
  if (lightboxOpen) {
    if (e.key === 'ArrowRight') { e.preventDefault(); navLightbox(1); }
    else if (e.key === 'ArrowLeft') { e.preventDefault(); navLightbox(-1); }
    else if (e.key === 'Escape') { e.preventDefault(); closeLightbox(); }
    return;
  }
  const dealVisible = document.getElementById('vdeal').style.display !== 'none';
  if (!dealVisible) return;
  if (e.key === 'ArrowRight' || e.key === 'ArrowDown') { e.preventDefault(); nav(1); }
  else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') { e.preventDefault(); nav(-1); }
  else if (e.key === 'Escape') { e.preventDefault(); showHome(); }
});

// ── boot ───────────────────────────────────────────────────────────────
(function(){
  initTokenUI();
  discoverSeances();
})();
</script>

<script>
// Gestion du tap : is-pressing après un délai, annulé si scroll détecté avant
(function() {
  let pressing = null, timer = null, startX = 0, startY = 0, scrolled = false;
  const DELAY = 100;   // ms avant d'activer l'effet
  const THRESHOLD = 8; // px de mouvement = scroll détecté

  function cancel() {
    if (timer) { clearTimeout(timer); timer = null; }
    if (pressing) { pressing.classList.remove('is-pressing'); pressing = null; }
    scrolled = false;
  }

  document.addEventListener('touchstart', e => {
    cancel();
    const el = e.target?.closest?.('.seance-card, .file-item, .file-icon, .img-thumb, .btn-arr, .btn-play, .btn-back');
    if (!el) return;
    startX = e.touches[0].clientX;
    startY = e.touches[0].clientY;
    scrolled = false;
    pressing = el;
    timer = setTimeout(() => {
      timer = null;
      if (!scrolled) el.classList.add('is-pressing');
    }, DELAY);
  }, {passive: true});

  document.addEventListener('touchmove', e => {
    if (!pressing) return;
    const dx = Math.abs(e.touches[0].clientX - startX);
    const dy = Math.abs(e.touches[0].clientY - startY);
    if (dx > THRESHOLD || dy > THRESHOLD) {
      scrolled = true;
      cancel();
    }
  }, {passive: true});

  document.addEventListener('touchend', e => {
    if (timer) { clearTimeout(timer); timer = null; }
    if (pressing && !scrolled) {
      // Tap confirmé : forcer l'effet visible puis le retirer
      pressing.classList.add('is-pressing');
      const el = pressing;
      pressing = null;
      setTimeout(() => el.classList.remove('is-pressing'), 150);
    } else {
      cancel();
    }
  }, {passive: true});
  document.addEventListener('touchcancel', e => { cancel(); }, {passive: true});

  // ── Desktop : mousedown / mouseup ───────────────────────────────────
  const SELECTOR = '.seance-card, .file-item, .file-icon, .img-thumb, .btn-arr, .btn-play, .btn-back';
  document.addEventListener('mousedown', e => {
    const el = e.target?.closest?.(SELECTOR);
    if (!el) return;
    el.classList.add('is-pressing');
  });
  document.addEventListener('mouseup', e => {
    document.querySelectorAll('.is-pressing').forEach(el => {
      setTimeout(() => el.classList.remove('is-pressing'), 150);
    });
  });
  document.addEventListener('mouseleave', e => {
    const el = e.target?.closest?.(SELECTOR);
    if (el) el.classList.remove('is-pressing');
  }, true);
})();
</script>
