<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Bridge PBN">
<title>Bridge PBN Viewer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Source+Serif+4:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --felt:    #0e0e12;
  --felt-dk: #07070a;
  --felt-md: #131318;
  --felt-lt: #1c1c24;
  --gold:    #f0c040;
  --gold-lt: #ffe06a;
  --cream:   #0a0a0d;
  --card-bg: #111116;
  --card-bd: #2a2a35;
  --red:     #ff4444;
  --blue:    #4488ff;
  --suit-s:  #60b4ff;
  --suit-h:  #ff5f6e;
  --suit-d:  #ffaa33;
  --suit-c:  #3ddd7a;
  --txt:     #eeeef5;
  --txt2:    #8888aa;
  --txt3:    #44445a;
  --sh-sm:   0 2px 10px rgba(0,0,0,.5), 0 1px 3px rgba(0,0,0,.4);
  --sh-lg:   0 6px 28px rgba(0,0,0,.7), 0 2px 8px rgba(0,0,0,.5);
  --r:       11px;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
body{font-family:'Source Serif 4',Georgia,serif;background:var(--cream);color:var(--txt);min-height:100vh;max-width:520px;margin:0 auto}

/* ── HEADER ── */
header{
  background:var(--felt-dk);
  padding:max(env(safe-area-inset-top,0px),12px) 18px 12px;
  display:flex;align-items:center;justify-content:space-between;
  position:sticky;top:0;z-index:200;
  border-bottom:1px solid rgba(200,151,58,.28);
}
.logo{display:flex;align-items:center;gap:11px}
.logo-icon{
  width:36px;height:36px;border-radius:8px;flex-shrink:0;
  background:linear-gradient(135deg,var(--gold),var(--gold-lt));
  display:flex;align-items:center;justify-content:center;
  font-size:19px;color:var(--felt-dk);
  box-shadow:0 2px 8px rgba(200,151,58,.38);
}
.logo-text h1{font-family:'Playfair Display',serif;font-size:15px;font-weight:700;color:#fff}
.logo-text p{font-size:10px;color:rgba(255,255,255,.33);margin-top:1px;letter-spacing:.5px}
.hd-suits{display:flex;gap:4px}
.hd-suits span{font-size:16px}
.hs{color:var(--suit-s)}.hh{color:var(--suit-h)}.hd{color:var(--suit-d)}.hc{color:var(--suit-c)}

/* ── CONFIG ── */
.config{
  background:linear-gradient(175deg,var(--felt-md) 0%,var(--felt) 100%);
  padding:16px 18px 20px;
  border-bottom:1px solid rgba(240,192,64,.12);
}
.cfg-label{font-size:10px;font-weight:600;color:rgba(255,255,255,.36);text-transform:uppercase;letter-spacing:1.2px;margin-bottom:9px}
.input-row{display:flex;gap:7px}
.repo-in{
  flex:1;padding:10px 13px;border-radius:9px;
  border:1.5px solid rgba(255,255,255,.1);
  background:rgba(0,0,0,.3);color:#fff;font-size:14px;
  font-family:'Source Serif 4',serif;outline:none;transition:border-color .15s;
}
.repo-in::placeholder{color:rgba(255,255,255,.17)}
.repo-in:focus{border-color:var(--gold)}
.btn-go{
  padding:10px 16px;border-radius:9px;border:none;cursor:pointer;
  background:linear-gradient(135deg,var(--gold),var(--gold-lt));
  color:var(--felt-dk);font-size:13px;font-weight:700;
  font-family:'Source Serif 4',serif;white-space:nowrap;
  transition:filter .15s,transform .1s;
}
.btn-go:active{filter:brightness(.88);transform:scale(.97)}
.cfg-hint{font-size:11px;color:rgba(255,255,255,.26);margin-top:8px;min-height:15px}
.divider{display:flex;align-items:center;gap:9px;margin:14px 0}
.div-line{flex:1;height:1px;background:rgba(255,255,255,.1)}
.div-txt{font-size:11px;color:rgba(255,255,255,.19)}
.btn-file{
  display:flex;align-items:center;justify-content:center;gap:7px;
  width:100%;padding:11px;border-radius:9px;
  border:1.5px dashed rgba(255,255,255,.17);
  background:rgba(255,255,255,.04);color:rgba(255,255,255,.53);
  font-size:13px;font-weight:600;font-family:'Source Serif 4',serif;cursor:pointer;
  transition:all .15s;
}
.btn-file:hover{background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.28)}

/* ── FILE LIST ── */
.file-list{padding:16px 18px;display:flex;flex-direction:column;gap:9px}
.file-item{
  background:var(--card-bg);border:1px solid var(--card-bd);
  border-radius:var(--r);padding:13px 15px;
  display:flex;align-items:center;gap:13px;
  cursor:pointer;box-shadow:var(--sh-sm);transition:transform .12s;
}
.file-item:active{transform:scale(.97)}
.file-icon{
  width:42px;height:42px;border-radius:10px;flex-shrink:0;
  background:linear-gradient(135deg,var(--felt),var(--felt-lt));
  display:flex;align-items:center;justify-content:center;font-size:20px;
}
.folder-icon{
  width:42px;height:42px;border-radius:10px;flex-shrink:0;
  background:linear-gradient(135deg,var(--gold),var(--gold-lt));
  display:flex;align-items:center;justify-content:center;font-size:20px;
}
.file-name{font-weight:600;font-size:15px;font-family:'Playfair Display',serif}
.file-meta{font-size:12px;color:var(--txt2);margin-top:2px}
.file-chev{margin-left:auto;color:var(--gold);font-size:20px;flex-shrink:0}

/* ── BREADCRUMB ── */
.breadcrumb-bar{
  background:linear-gradient(175deg,var(--felt-md) 0%,var(--felt) 100%);
  padding:0 18px 10px;
  border-bottom:1px solid rgba(200,151,58,.15);
}
.breadcrumb{
  display:flex;align-items:center;flex-wrap:wrap;gap:2px;
  font-size:12px;
  border-top:1px solid rgba(255,255,255,.08);
  padding-top:9px;
}
.bc-part{
  background:none;border:none;color:rgba(255,255,255,.55);
  font-size:12px;font-family:'Source Serif 4',serif;
  cursor:pointer;padding:3px 7px;border-radius:5px;
  transition:background .12s,color .12s;
}
.bc-part:hover{background:rgba(255,255,255,.1);color:#fff}
.bc-sep{color:rgba(255,255,255,.2);font-size:11px;padding:0 1px}

/* ── DEAL VIEW ── */
.deal-view{display:none}
.deal-nav{
  background:var(--card-bg);border-bottom:1px solid var(--card-bd);
  padding:9px 15px;display:flex;align-items:center;justify-content:space-between;
  position:sticky;top:60px;z-index:100;box-shadow:var(--sh-sm);
}
.btn-back{
  display:flex;align-items:center;gap:5px;padding:7px 11px;border-radius:8px;
  border:1.5px solid var(--card-bd);background:transparent;color:var(--txt);
  font-size:13px;font-weight:600;font-family:'Source Serif 4',serif;cursor:pointer;
}
.nav-ctr{font-size:12px;color:var(--txt2);font-weight:500}
.nav-arr{display:flex;gap:5px}
.btn-arr{
  width:33px;height:33px;border-radius:8px;border:none;
  background:var(--felt);color:#fff;font-size:18px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  transition:filter .12s,transform .1s;
}
.btn-arr:active{filter:brightness(.8);transform:scale(.93)}
.btn-arr:disabled{background:var(--card-bd);color:var(--txt3);cursor:not-allowed}

/* ── DEAL CONTENT ── */
.deal-wrap{padding:14px 12px;display:flex;flex-direction:column;gap:12px;padding-bottom:48px}

/* ── BOARD HEADER ── */
.board-hdr{
  background:linear-gradient(135deg,var(--felt-dk) 0%,var(--felt-md) 100%);
  border-radius:var(--r);padding:13px 17px;
  display:flex;justify-content:space-between;align-items:center;
  box-shadow:var(--sh-lg);border:1px solid rgba(240,192,64,.15);
}
.board-num{font-family:-apple-system,'SF Pro Text',system-ui,sans-serif;color:#fff;font-size:18px;font-weight:600;line-height:1;display:flex;align-items:center;letter-spacing:0}
.board-badges{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.badge{
  padding:4px 0;border-radius:6px;font-size:11px;font-weight:600;
  background:rgba(255,255,255,.1);color:rgba(255,255,255,.7);
  text-align:center;white-space:nowrap;
}
/* Fixed widths per badge family */
.badge-dealer  {width:100px} /* "Donneur : Ouest" */
.badge-vul-box {width:72px}  /* "Vul. Tous" */
.badge-contract{width:96px}  /* "3SA par Ouest" */
.badge-vul{background:rgba(185,28,28,.33);color:#fca5a5}
.badge-nov{background:rgba(34,197,94,.18);color:#86efac}

/* ── DIAGRAM ── */
/*
  STRUCTURE :
  ┌─────────────────────────────────────┐
  │              NORD                   │  ← 3-col span, centré
  ├─────────────┬────────────┬──────────┤
  │   OUEST     │  Boussole  │   EST    │
  ├─────────────┴────────────┴──────────┤
  │              SUD                    │  ← 3-col span, centré
  └─────────────────────────────────────┘

  3 colonnes : [Ouest flex] [boussole 56px] [Est flex]
  Nord & Sud : span 3 cols, la main elle-même est centrée via justify-self:center
*/
.diag-card{
  background:linear-gradient(155deg,var(--felt-md) 0%,var(--felt) 50%,var(--felt-dk) 100%);
  border-radius:var(--r);box-shadow:var(--sh-lg);
  border:1px solid rgba(240,192,64,.08);
  padding:10px;
}
/* ── DIAGRAM ── */
.diag-grid{display:flex;flex-direction:column;gap:5px}
.diag-row{display:flex;flex-direction:row;gap:5px;align-items:stretch;justify-content:center}
/* Mains latérales (Ouest/Est) : moitié de la largeur moins boussole et gaps */
.hand{
  flex:1 1 0;
  background:var(--card-bg);
  border:1px solid var(--card-bd);
  border-radius:9px;
  padding:9px 11px 24px;
  box-shadow:var(--sh-sm);
  position:relative;
  min-width:0;
}
.hand::after{
  content:'';position:absolute;inset:0;border-radius:9px;
  background:linear-gradient(135deg,rgba(255,255,255,.05) 0%,transparent 55%);
  pointer-events:none;
}
/* Nord/Sud : même largeur exacte qu'une main latérale, pas de flex */
.hand-ns{
  flex:none;
  width:calc((100% - 54px) / 2);
  margin:0 auto;
}

/* direction label */
.hand-lbl{
  font-size:8px;font-weight:700;letter-spacing:1.1px;text-transform:uppercase;
  color:var(--txt3);margin-bottom:5px;
  display:flex;align-items:center;justify-content:center;gap:4px;
}
/* Vulnerability colors on direction label */
.lbl-vul{color:#e05555}
.lbl-nov{color:#5aaa6a}
/* Dealer badge — circled D */
.dealer-badge{
  display:inline-flex;align-items:center;justify-content:center;
  width:13px;height:13px;border-radius:50%;
  border:1.5px solid #ffffff;
  color:#ffffff;
  font-size:7px;font-weight:900;letter-spacing:0;
  flex-shrink:0;
}
/* Invisible spacer to keep name centered when dealer badge present */
.dealer-spacer{width:13px;flex-shrink:0}

/* HCP badge — inside hand, bottom right */
.hcp-badge{
  position:absolute;
  bottom:7px;right:9px;
  background:rgba(200,151,58,0.18);
  color:var(--gold);
  font-size:10px;font-weight:700;
  padding:2px 6px;border-radius:5px;
  letter-spacing:0.3px;
  border:1px solid rgba(200,151,58,0.25);
}
.diag-col{display:flex;flex-direction:column;flex:1 1 0;min-width:0}
.diag-row-ns{display:flex;flex-direction:column;align-items:center}

/* SUIT ROWS */
.sr{display:flex;align-items:baseline;gap:5px;line-height:1.72;flex-wrap:nowrap;min-height:22px}
.sym{font-size:14px;width:18px;text-align:center;flex-shrink:0;line-height:1;display:inline-block}
.cds{font-size:13px;font-weight:700;font-family:-apple-system,'SF Pro Text',system-ui,sans-serif;word-spacing:2px;letter-spacing:0;white-space:nowrap;color:var(--txt)}
.vd{font-size:11px;color:var(--txt3);font-weight:400;line-height:1.72}
/* Lead card — circular white outline around the card value */
.lead-card{
  display:inline-block;
  background:#ffffff;
  color:#111111;
  border-radius:50%;
  width:1.15em;
  height:1.15em;
  line-height:1.15em;
  text-align:center;
  font-weight:900;
  font-family:inherit;
  font-size:0.95em;
  vertical-align:baseline;
  margin:0;
}

/* suit colours */
.cs{color:var(--suit-s)}.ch{color:var(--suit-h)}.cd{color:var(--suit-d)}.cc{color:var(--suit-c)}
.hs{color:var(--suit-s)}.hh{color:var(--suit-h)}.hd{color:var(--suit-d)}.hc{color:var(--suit-c)}

/* COMPASS */
.compass-cell{flex:0 0 44px;display:flex;align-items:center;justify-content:center}
.compass{
  width:38px;height:38px;position:relative;
  background:radial-gradient(circle at 35% 30%,rgba(255,255,255,.05),rgba(0,0,0,.6));
  border-radius:50%;
  border:1px solid rgba(240,192,64,.4);
  box-shadow:inset 0 2px 6px rgba(0,0,0,.5),0 2px 6px rgba(0,0,0,.4),0 0 8px rgba(240,192,64,.1);
}
.compass::before{content:'';position:absolute;top:50%;left:6px;right:6px;height:1px;background:rgba(240,192,64,.2);transform:translateY(-50%)}
.compass::after {content:'';position:absolute;left:50%;top:6px;bottom:6px;width:1px;background:rgba(240,192,64,.2);transform:translateX(-50%)}
.cpt{position:absolute;color:rgba(255,255,255,.85);font-size:8px;font-weight:800}
.cpt-n{top:2px;left:50%;transform:translateX(-50%)}
.cpt-s{bottom:2px;left:50%;transform:translateX(-50%)}
.cpt-o{left:3px;top:50%;transform:translateY(-50%)}
.cpt-e{right:3px;top:50%;transform:translateY(-50%)}

/* ── SECTION CARD ── */
.sc{background:var(--card-bg);border:1px solid var(--card-bd);border-radius:var(--r);overflow:hidden;box-shadow:var(--sh-sm)}
.sc-head{padding:9px 15px;border-bottom:1px solid var(--card-bd);font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:1px;color:var(--txt2);background:var(--felt-md)}
.sc-body{padding:13px 11px}

/* ── AUCTION ── */
.auc-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
.auc-th{text-align:center;padding:7px 2px;border-radius:6px;font-size:10px;font-weight:700;letter-spacing:.5px;background:var(--felt-dk);color:rgba(255,255,255,.52)}
.auc-td{text-align:center;padding:6px 2px;border-radius:6px;min-height:34px;display:flex;align-items:center;justify-content:center;background:var(--felt-lt);border:1px solid var(--card-bd);font-size:14px}
.bp{font-size:10px;color:var(--txt3);font-weight:600}
.bx{color:var(--red);font-weight:800;font-size:14px}
.bxx{color:var(--blue);font-weight:800;font-size:14px}
.c-h{color:var(--suit-h);font-weight:800}
.c-d{color:var(--suit-d);font-weight:800}
.c-s{color:var(--suit-s);font-weight:800}
.c-c{color:var(--suit-c);font-weight:800}
.b-sa{color:var(--txt);font-size:11px;font-weight:700}

/* ── COMMENT ── */
.cmt{border-left:3px solid var(--gold);padding:9px 13px;border-radius:0 8px 8px 0;background:var(--felt-lt);font-size:14px;line-height:1.75;white-space:pre-wrap}

/* ── SÉANCE GRID ── */
.seance-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:4px}
.seance-card{
  background:var(--felt-lt);border:1.5px solid rgba(240,192,64,.18);
  border-radius:10px;padding:13px 8px 11px;
  display:flex;flex-direction:column;align-items:center;gap:5px;
  cursor:pointer;transition:background .15s,border-color .15s,transform .1s;
  text-align:center;
}
.seance-card:active{transform:scale(.95)}
.seance-card:hover{background:rgba(255,255,255,.05);border-color:var(--gold);box-shadow:0 0 12px rgba(240,192,64,.15)}
.seance-num{font-family:'Playfair Display',serif;font-size:22px;font-weight:900;color:var(--gold-lt);line-height:1}
.seance-lbl{font-size:10px;font-weight:600;color:rgba(255,255,255,.38);letter-spacing:.6px;text-transform:uppercase}
.seance-count{font-size:11px;color:rgba(255,255,255,.5);margin-top:1px}

/* ── MISC ── */
.empty{padding:56px 22px;text-align:center}
.empty .ei{font-size:48px;margin-bottom:13px}
.empty h3{font-family:'Playfair Display',serif;font-size:18px;font-weight:700;margin-bottom:7px}
.empty p{font-size:14px;color:var(--txt2);line-height:1.6}
.loading{padding:44px;text-align:center;color:var(--txt2);font-size:14px}
</style>
</head>
<body>

<!-- HOME -->
<div id="vhome">
  <header>
    <div class="logo">
      <div class="logo-icon" style="width:56px;height:36px;border-radius:8px;background:var(--felt-dk);border:1px solid rgba(200,151,58,.3);font-size:14px;font-weight:900;font-family:'Playfair Display',serif;letter-spacing:.5px;padding:0 7px;box-shadow:none">
        <span style="color:var(--suit-s)">Q</span><span style="color:var(--suit-h)">P</span><span style="color:var(--suit-d)">J</span><span style="color:var(--suit-c)">B</span>
      </div>
      <div class="logo-text"><h1>Visualiseur de donnes</h1></div>
    </div>
    <div class="hd-suits"><span class="hs">♠</span><span class="hh">♥</span><span class="hd">♦</span><span class="hc">♣</span></div>
  </header>

  <div class="config">
    <div class="cfg-label" id="cfg-label-seances">Séances disponibles</div>
    <div id="seance-grid" class="seance-grid"><div class="loading" style="color:rgba(255,255,255,.4);padding:18px 0 8px">Recherche des séances…</div></div>
    <div class="cfg-hint" id="cfg-hint"></div>
    <div class="divider"><div class="div-line"></div><span class="div-txt">ou</span><div class="div-line"></div></div>
    <label class="btn-file">
      📂 Ouvrir un fichier PBN local
      <input type="file" accept=".pbn,.txt" style="display:none" onchange="loadLocalFile(this)">
    </label>
  </div>
  <div id="breadcrumb-bar" class="breadcrumb-bar" style="display:none">
    <div class="breadcrumb" id="breadcrumb"></div>
  </div>
  <div id="file-list"></div>
</div>

<!-- DEAL VIEW -->
<div class="deal-view" id="vdeal">
  <header>
    <div class="logo">
      <div class="logo-icon" style="width:56px;height:36px;border-radius:8px;background:var(--felt-dk);border:1px solid rgba(200,151,58,.3);font-size:14px;font-weight:900;font-family:'Playfair Display',serif;letter-spacing:.5px;padding:0 7px;box-shadow:none">
        <span style="color:var(--suit-s)">Q</span><span style="color:var(--suit-h)">P</span><span style="color:var(--suit-d)">J</span><span style="color:var(--suit-c)">B</span>
      </div>
      <div class="logo-text">
        <h1>Bridge PBN</h1>
        <p id="deal-fname" style="max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap"></p>
      </div>
    </div>
    <div class="hd-suits"><span class="hs">♠</span><span class="hh">♥</span><span class="hd">♦</span><span class="hc">♣</span></div>
  </header>
  <div class="deal-nav">
    <button class="btn-back" onclick="showHome()">← Retour</button>
    <span class="nav-ctr" id="nav-ctr"></span>
    <div class="nav-arr">
      <button class="btn-arr" id="btn-prev" onclick="nav(-1)">‹</button>
      <button class="btn-arr" id="btn-next" onclick="nav(1)">›</button>
    </div>
  </div>
  <div class="deal-wrap" id="deal-content"></div>
</div>

<script>
// ── constants ──────────────────────────────────────────────────────────
const SUITS  = ['S','H','D','C'];
const SYM    = {S:'♠',H:'♥',D:'♦',C:'♣'};
const SCLS   = {S:'cs',H:'ch',D:'cd',C:'cc'};
const DIR_FR = {N:'Nord',S:'Sud',E:'Est',W:'Ouest'};
const VUL_FR = {None:'Non vul.',NS:'Vul. N-S',EW:'Vul. E-O',All:'Tous vul.'};
// PBN clockwise: N→E→S→W
const CW = ['N','E','S','W'];

// ── card translation EN→FR ─────────────────────────────────────────────
// Returns compact string "ARD107" or null for void
function frCards(raw) {
  if (!raw) return null;
  const s = raw.trim();
  if (!s || s === '-') return null;
  const tokens = [];
  for (let i = 0; i < s.length; i++) {
    const c = s[i];
    if      (c === 'A')                     tokens.push('A');
    else if (c === 'K')                     tokens.push('R');
    else if (c === 'Q')                     tokens.push('D');
    else if (c === 'J')                     tokens.push('V');
    else if (c === 'T')                     tokens.push('10');
    else if (c === '1' && s[i+1] === '0')   { tokens.push('10'); i++; }
    else if (c >= '2' && c <= '9')          tokens.push(c);
  }
  return tokens.length ? tokens.join(' ') : null;
}

// ── state ──────────────────────────────────────────────────────────────
let deals = [], idx = 0;
let pbnFiles = [], pbnIdx = 0;
const pbnCache = {};

async function fetchPBN(url) {
  if (pbnCache[url]) return pbnCache[url];
  const buf = await (await fetch(url)).arrayBuffer();
  const bytes = new Uint8Array(buf);
  let text = new TextDecoder('utf-8').decode(bytes);
  if (text.includes('\uFFFD')) text = new TextDecoder('iso-8859-1').decode(bytes);
  pbnCache[url] = text;
  return text;
}

function preloadAdjacent(idx) {
  // Silently preload prev and next files in background
  [idx-1, idx+1].forEach(i => {
    if (i >= 0 && i < pbnFiles.length) {
      const url = pbnFiles[i].download_url;
      if (!pbnCache[url]) fetchPBN(url).catch(()=>{});
    }
  });
}

// ── helpers ────────────────────────────────────────────────────────────
const esc = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
function setHint(msg, err) {
  const h = document.getElementById('cfg-hint');
  h.textContent = msg;
  h.style.color = err ? '#f87171' : 'rgba(255,255,255,.26)';
}

// ── Token GitHub ───────────────────────────────────────────────────────
function ghHeaders() {
  const token = localStorage.getItem('gh-token');
  const h = {Accept:'application/vnd.github.v3+json'};
  if (token) h['Authorization'] = `token ${token}`;
  return h;
}
function saveToken() {
  const val = document.getElementById('token-input').value.trim();
  if (!val) return;
  localStorage.setItem('gh-token', val);
  document.getElementById('token-input').value = '';
  updateTokenUI();
  discoverSeances();
}
function clearToken() {
  localStorage.removeItem('gh-token');
  updateTokenUI();
  discoverSeances();
}
function updateTokenUI() {
  const token = localStorage.getItem('gh-token');
  const status = document.getElementById('token-status');
  const clearBtn = document.getElementById('btn-clear-token');
  if (token) {
    status.innerHTML = `<span style="color:var(--suit-c)">✓ Token configuré</span> <span style="color:rgba(255,255,255,.25)">(${token.slice(0,8)}…)</span>`;
    clearBtn.style.display = 'inline-flex';
  } else {
    status.textContent = 'Sans token : limite 60 req/heure';
    clearBtn.style.display = 'none';
  }
}

// ── GitHub loader ──────────────────────────────────────────────────────
const GH_USER = 'capgui13';

let currentRepo = '';
let folderStack = [];

// seances.json cache
let seancesData = null;

async function discoverSeances() {
  const grid = document.getElementById('seance-grid');
  grid.innerHTML = '<div class="loading" style="color:rgba(255,255,255,.4);padding:18px 0 8px">Chargement des séances…</div>';
  setHint('');
  try {
    const url = `https://raw.githubusercontent.com/${GH_USER}/QPJB/main/seances.json`;
    const res = await fetch(url + '?_=' + Date.now()); // cache-bust
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    seancesData = await res.json();
    const seances = seancesData.seances || [];
    if (!seances.length) {
      grid.innerHTML = '<div style="color:rgba(255,255,255,.35);font-size:13px;padding:8px 0">Aucune séance dans seances.json.</div>';
      return;
    }
    grid.innerHTML = seances.map(s => `
      <div class="seance-card" onclick="loadSeance('${esc(s.repo)}')">
        <div class="seance-num" style="font-size:16px;letter-spacing:.5px">${esc(s.repo)}</div>
        <div class="seance-count" style="margin-top:3px">${s.fichiers.length} fichier${s.fichiers.length!==1?'s':''}</div>
      </div>`).join('');
    setHint(`${seances.length} séance${seances.length>1?'s':''} trouvée${seances.length>1?'s':''}`);
  } catch(e) {
    grid.innerHTML = '<div style="color:#ff5f6e;font-size:13px;padding:8px 0">Impossible de lire seances.json</div>';
    setHint('Erreur : ' + e.message, true);
  }
}

async function loadSeance(repoName) {
  const seance = (seancesData?.seances || []).find(s => s.repo === repoName);
  if (!seance) return;
  currentRepo = `${GH_USER}/${repoName}`;
  folderStack = [];
  renderBreadcrumb();

  const fichiers = seance.fichiers;
  // Build file objects from the JSON list (no API call needed)
  pbnFiles = fichiers.map(name => ({
    name,
    download_url: `https://raw.githubusercontent.com/${GH_USER}/${repoName}/main/${name}`
  }));

  // Preload all in background
  pbnFiles.forEach(f => fetchPBN(f.download_url).catch(()=>{}));

  const rows = pbnFiles.map(f =>
    `<div class="file-item" onclick="openFile('${f.download_url}','${esc(f.name)}')">
      <div class="file-icon">🃏</div>
      <div><div class="file-name">${esc(f.name)}</div><div class="file-meta">PBN</div></div>
      <div class="file-chev">›</div>
    </div>`);

  document.getElementById('file-list').innerHTML = '<div class="file-list">' + rows.join('') + '</div>';
  setHint(`${fichiers.length} fichier${fichiers.length>1?'s':''} PBN`);
}

function goToHome() {
  currentRepo = ''; folderStack = [];
  document.getElementById('breadcrumb-bar').style.display = 'none';
  document.getElementById('file-list').innerHTML = '';
  discoverSeances();
}

function renderBreadcrumb() {
  const bar = document.getElementById('breadcrumb-bar');
  const bc  = document.getElementById('breadcrumb');
  if (!currentRepo) { bar.style.display = 'none'; return; }
  bar.style.display = 'block';
  const repoLabel = currentRepo.split('/')[1] || currentRepo;
  bc.innerHTML = `<button class="bc-part" onclick="goToHome()">⬅ Séances</button>
                  <span class="bc-sep">›</span>
                  <span class="bc-part" style="color:#fff;font-weight:600;cursor:default">${esc(repoLabel)}</span>`;
}

// ── file openers ───────────────────────────────────────────────────────
async function openFile(url, name) {
  pbnIdx = pbnFiles.findIndex(f => f.download_url === url);
  showDeal(name);
  try {
    const text = await fetchPBN(url);
    doLoad(text, name);
    preloadAdjacent(pbnIdx);
  } catch(e) { showErr(e.message); }
}
function loadLocalFile(input) {
  const f = input.files[0]; if (!f) return;
  showDeal(f.name);
  const r = new FileReader();
  // Try UTF-8 first; if it contains replacement chars, retry as ISO-8859-1
  r.onload = e => {
    const text = e.target.result;
    if (text.includes('\uFFFD')) {
      // Has invalid UTF-8 sequences — re-read as ISO-8859-1
      const r2 = new FileReader();
      r2.onload = e2 => doLoad(decodeISO(e2.target.result), f.name);
      r2.readAsArrayBuffer(f);
    } else {
      doLoad(text, f.name);
    }
  };
  r.readAsText(f, 'utf-8');
}
function decodeISO(buf) {
  return new TextDecoder('iso-8859-1').decode(new Uint8Array(buf));
}
function doLoad(text, name) {
  deals = parsePBN(text);
  if (!deals.length) { showErr('Aucune donne trouvée.'); return; }
  // Strip extension for display
  const displayName = name.replace(/\.pbn$/i, '');
  deals.forEach(d => d._filename = displayName);
  idx = 0;
  document.getElementById('deal-fname').textContent = name;
  render(0);
}
function showDeal(name) {
  document.getElementById('vhome').style.display = 'none';
  document.getElementById('vdeal').style.display = 'block';
  document.getElementById('deal-content').innerHTML = '<div class="loading">Chargement…</div>';
}
function showHome() {
  document.getElementById('vdeal').style.display = 'none';
  document.getElementById('vhome').style.display = 'block';
}
function showErr(msg) {
  document.getElementById('deal-content').innerHTML =
    `<div class="empty"><div class="ei">⚠️</div><h3>Erreur</h3><p>${esc(msg)}</p></div>`;
}
function nav(dir) {
  // If multiple deals in current file, navigate within
  if (deals.length > 1) {
    const n = idx + dir;
    if (n >= 0 && n < deals.length) { idx = n; render(n); window.scrollTo(0,0); }
    return;
  }
  // Otherwise navigate between PBN files
  if (pbnFiles.length > 1) {
    const n = pbnIdx + dir;
    if (n >= 0 && n < pbnFiles.length) {
      openFile(pbnFiles[n].download_url, pbnFiles[n].name);
    }
  }
}

function updateNavCounter() {
  if (pbnFiles.length > 1) {
    document.getElementById('nav-ctr').textContent =
      `Donne ${pbnIdx+1} / ${pbnFiles.length}`;
    document.getElementById('btn-prev').disabled = pbnIdx === 0;
    document.getElementById('btn-next').disabled = pbnIdx === pbnFiles.length-1;
  } else {
    document.getElementById('nav-ctr').textContent =
      deals.length > 1 ? `Donne ${idx+1} / ${deals.length}` : '';
    document.getElementById('btn-prev').disabled = idx === 0;
    document.getElementById('btn-next').disabled = idx === deals.length-1;
  }
}

// ── PBN parser ─────────────────────────────────────────────────────────
function parsePBN(text) {
  const out = [];
  const normalized = text
    .replace(/^\uFEFF/, '')
    .replace(/\r\n/g, '\n').replace(/\r/g, '\n')
    .replace(/\\n/g, '\n'); // literal \n sequences in PBN comments

  // Strategy: first extract all { } comment blocks (can span multiple lines),
  // then process the remaining text line by line.
  let cleanText = '', commentList = [];
  let ci = 0;
  while (ci < normalized.length) {
    const ob = normalized.indexOf('{', ci);
    if (ob < 0) { cleanText += normalized.slice(ci); break; }
    cleanText += normalized.slice(ci, ob);
    const cb = normalized.indexOf('}', ob);
    if (cb < 0) { break; } // unclosed comment — stop
    commentList.push(normalized.slice(ob+1, cb).trim());
    cleanText += '\uFFFD'; // placeholder so line structure is preserved
    ci = cb + 1;
  }

  let comIdx = 0;
  const lines = cleanText.split('\n');
  let cur = null, coms = [], mode = null;

  const flush = () => {
    if (cur && cur.Deal) {
      if (coms.length) cur.Comment = coms.join('\n').trim();
      out.push({...cur});
    }
    cur = null; coms = []; mode = null;
  };

  for (let raw of lines) {
    // Replace comment placeholders
    const hadPlaceholder = raw.includes('\uFFFD');
    let line = raw.replace(/\uFFFD/g, () => {
      const c = commentList[comIdx++] || '';
      if (c) coms.push(c);
      return '';
    }).trim();

    // Skip % directives
    if (line.startsWith('%')) continue;

    // Blank line = end of deal — but NOT if it was just a comment placeholder
    if (!line) {
      if (!hadPlaceholder) flush();
      continue;
    }

    // Tag line: [Key "Value"]
    const tm = line.match(/^\[(\w+)\s+"(.*)"\]$/);
    if (tm) {
      const [, k, v] = tm;
      if (!cur) cur = {};
      if (k === 'Auction') {
        cur.AuctionFirst = v;
        cur.Auction = '';
        mode = 'auction';
      } else if (k === 'Play') {
        cur.PlayFirst = v; // direction of lead
        mode = 'play';
        cur.Lead = null; // will be set from first play line
      } else if (k === 'Note') {
        mode = null;
        cur.Note = cur.Note ? cur.Note + '\n' + v : v;
      } else {
        mode = null;
        cur[k] = v;
      }
      continue;
    }

    // Data lines after Auction
    if (mode === 'auction' && cur) {
      const bids = line.split(/\s+/).filter(Boolean);
      cur.Auction = (cur.Auction ? cur.Auction + ' ' : '') + bids.join(' ');
    }
    // First play line = lead card
    if (mode === 'play' && cur && !cur.Lead) {
      const first = line.trim().split(/\s+/)[0];
      if (first && /^[SHDC][A-Z0-9T]+$/i.test(first)) cur.Lead = first.toUpperCase();
    }
  }
  flush();
  return out;
}

// ── deal string parser ─────────────────────────────────────────────────
// PBN spec: "first:h0 h1 h2 h3" clockwise N→E→S→W
// Each hand: "S.H.D.C", void suit = '-' or ''
function parseDeal(str) {
  if (!str) return null;
  const m = str.match(/^([NSEWnsew]):(.+)$/);
  if (!m) return null;
  const first = m[1].toUpperCase();
  const si = CW.indexOf(first);
  if (si < 0) return null;
  const dirs = [0,1,2,3].map(i => CW[(si+i)%4]);
  const res = {};
  m[2].trim().split(/\s+/).forEach((h, i) => {
    if (i > 3) return;
    const p = h.split('.');
    while (p.length < 4) p.push('');
    res[dirs[i]] = {
      S: p[0]==='-' ? '' : p[0],
      H: p[1]==='-' ? '' : p[1],
      D: p[2]==='-' ? '' : p[2],
      C: p[3]==='-' ? '' : p[3],
    };
  });
  return res;
}

// ── render deal ────────────────────────────────────────────────────────
function render(i) {
  const d = deals[i], total = deals.length;
  idx = i;
  updateNavCounter();

  const dealer  = d.Dealer || '?';
  const vul     = d.Vulnerable || 'None';
  const hands   = parseDeal(d.Deal || '');
  const auction = (d.Auction || '').trim();
  const auctionFirst = d.AuctionFirst || dealer;
  const comment = (d.Comment || d.Note || '').trim();
  const contract = d.Contract || '';
  const declarer = d.Declarer || '';
  const lead = d.Lead || '';

  const vulLabel = {None:'Vul. Pers.', NS:'Vul. N-S', EW:'Vul. E-O', All:'Vul. Tous'}[vul] || vul;
  const vulCls   = vul === 'None' ? 'badge-nov' : 'badge-vul';

  let html = `
    <div class="board-hdr">
      <div class="board-num">${esc(d._filename || String(d.Board||i+1))}</div>
      <div class="board-badges">
        <span class="badge badge-dealer">Donneur : ${esc(DIR_FR[dealer]||dealer)}</span>
        <span class="badge badge-vul-box ${vulCls}">${esc(vulLabel)}</span>
        ${contract ? `<span class="badge badge-contract">${fmtContract(contract, declarer)}</span>` : ''}
      </div>
    </div>
    <div class="diag-card">${renderDiag(hands, lead, d.PlayFirst, dealer, vul)}</div>`;

  if (auction && auction !== '?')
    html += `<div class="sc"><div class="sc-body">${renderAuction(auctionFirst, auction)}</div></div>`;

  if (comment) {
    const paras = comment.split(/\n\s*\n/).map(p =>
      p.split('\n').map(l => l.trim()).filter(Boolean).join(' ')
    ).filter(Boolean);
    const cmtHtml = paras.map(p => `<p style="margin:0 0 10px">${fmtComment(p)}</p>`).join('');
    html += `<div class="sc"><div class="sc-body"><div class="cmt" style="white-space:normal;line-height:1.7">${cmtHtml}</div></div></div>`;
  }

  document.getElementById('deal-content').innerHTML = html;
}

// ── format comment — replace suit codes with symbols ───────────────────
function fmtComment(text) {
  // French bridge: P=♠ C=♥ K=♦ T=♣
  const MAP = {'P':['♠','cs'], 'C':['♥','ch'], 'K':['♦','cd'], 'T':['♣','cc']};
  const isLetter = c => c && /\p{L}/u.test(c);

  const re = /((?:10|[ARDVXardvx2-9])?)([PCKTpckt])/g;

  const converted = text.replace(re, (match, prefix, suit, offset, src) => {
    const s = suit.toUpperCase();
    if (!MAP[s]) return match;
    // Character immediately before the whole match
    const before = src[offset - 1];
    // Character immediately after the whole match
    const after  = src[offset + match.length];
    // Skip if the letter after the suit is a letter (part of a word like "repart")
    if (isLetter(after)) return match;
    // Skip if no prefix and preceded by a letter (part of a word like "placé")
    if (!prefix && isLetter(before)) return match;
    // Skip if there's a prefix but the char before the prefix is a letter
    if (prefix && isLetter(src[offset - 1])) return match;
    const [sym, cls] = MAP[s];
    return (prefix || '') + `\x00${cls}\x01${sym}\x02`;
  });

  return esc(converted)
    .replace(/\x00([a-z-]+)\x01([^\x02]*)\x02/g,
      (_, cls, sym) => `<span class="${cls}">${sym}</span>`);
}
function fmtContract(contract, declarer) {
  if (!contract || contract === '?' || contract === 'Pass') return esc(contract);
  const m = contract.match(/^([1-7])(S|H|D|C|NT|N)(X{0,2})$/i);
  if (!m) return esc(contract);
  const suitUp = m[2].toUpperCase();
  const symMap = {S:'♠', H:'♥', D:'♦', C:'♣', NT:'SA', N:'SA'};
  const clsMap = {S:'cs', H:'ch', D:'cd', C:'cc'};
  const sym = symMap[suitUp] || suitUp;
  const cls = clsMap[suitUp] || '';
  const dbl  = m[3] ? ` ${m[3]}` : '';
  const decl = declarer ? ` par ${DIR_FR[declarer.toUpperCase()]||declarer}` : '';
  const suitSpan = cls ? `<span class="${cls}">${sym}</span>` : sym;
  return `${m[1]}${suitSpan}${dbl}${decl}`;
}

// ── format lead for badge (suit in correct color) ─────────────────────
function fmtLeadBadge(lead) {
  if (!lead || lead.length < 2) return esc(lead);
  const suitChar = lead[0].toUpperCase();
  const cardStr = lead.slice(1).toUpperCase();
  const sym = {S:'♠',H:'♥',D:'♦',C:'♣'}[suitChar] || suitChar;
  const isRed = suitChar === 'H' || suitChar === 'D';
  const tokens = [];
  for (let i = 0; i < cardStr.length; i++) {
    const c = cardStr[i];
    if (c==='K') tokens.push('R');
    else if (c==='Q') tokens.push('D');
    else if (c==='J') tokens.push('V');
    else if (c==='T') tokens.push('10');
    else if (c==='1' && cardStr[i+1]==='0') { tokens.push('10'); i++; }
    else tokens.push(c);
  }
  const suitHtml = isRed
    ? `<span style="color:#f87171;font-weight:800">${sym}</span>`
    : `<span style="font-weight:800">${sym}</span>`;
  return `${suitHtml} ${tokens.join(' ')}`;
}

// ── format lead card plain text ────────────────────────────────────────
function fmtLead(lead) {
  if (!lead || lead.length < 2) return esc(lead);
  const suitChar = lead[0].toUpperCase();
  const cardStr = lead.slice(1).toUpperCase();
  const sym = {S:'♠',H:'♥',D:'♦',C:'♣'}[suitChar] || suitChar;
  const tokens = [];
  for (let i = 0; i < cardStr.length; i++) {
    const c = cardStr[i];
    if (c==='K') tokens.push('R');
    else if (c==='Q') tokens.push('D');
    else if (c==='J') tokens.push('V');
    else if (c==='T') tokens.push('10');
    else if (c==='1' && cardStr[i+1]==='0') { tokens.push('10'); i++; }
    else tokens.push(c);
  }
  return `${sym} ${tokens.join(' ')}`;
}

// ── HCP calculator ─────────────────────────────────────────────────────
function calcHCP(hand) {
  if (!hand) return 0;
  let pts = 0;
  for (const suit of SUITS) {
    const s = (hand[suit] || '').toUpperCase();
    for (let i = 0; i < s.length; i++) {
      if (s[i]==='A') pts += 4;
      else if (s[i]==='K') pts += 3;
      else if (s[i]==='Q') pts += 2;
      else if (s[i]==='J') pts += 1;
    }
  }
  return pts;
}

// ── render hand — returns {suits, hcp} ────────────────────────────────
function renderHand(hand, leadInfo) {
  if (!hand) return { suits: '<div class="vd">—</div>', hcp: 0 };
  const hcp = calcHCP(hand);
  const suits = SUITS.map(s => {
    const raw = hand[s] || '';
    const k = SCLS[s];
    if (!raw || raw === '-') {
      return `<div class="sr"><span class="sym ${k}">${SYM[s]}</span><span class="vd">—</span></div>`;
    }
    const tokens = [];
    for (let i = 0; i < raw.length; i++) {
      const c = raw[i];
      let fr;
      if      (c==='A') fr='A';
      else if (c==='K') fr='R';
      else if (c==='Q') fr='D';
      else if (c==='J') fr='V';
      else if (c==='T') fr='10';
      else if (c==='1'&&raw[i+1]==='0') { fr='10'; i++; }
      else fr=c;
      const isLead = leadInfo && s === leadInfo.suit && c === leadInfo.card;
      tokens.push(isLead ? `<span class="lead-card">${fr}</span>` : fr);
    }
    return `<div class="sr"><span class="sym ${k}">${SYM[s]}</span><span class="cds">${tokens.join(' ')}</span></div>`;
  }).join('');
  return { suits, hcp };
}

// ── render diagram ─────────────────────────────────────────────────────
function renderDiag(hands, lead, playFirst, dealer, vul) {
  const h = hands || {};

  const vulDirs = {'None':[],'NS':['N','S'],'EW':['E','W'],'All':['N','S','E','W']}[vul]||[];
  const lblClass = dir => vulDirs.includes(dir) ? 'lbl-vul' : 'lbl-nov';
  const lblName  = {N:'Nord', S:'Sud', E:'Est', W:'Ouest'};

  const handLbl = dir => {
    const isDealer = dealer && dir === dealer.toUpperCase();
    const cls = lblClass(dir);
    return `<div class="hand-lbl ${cls}">
      ${isDealer ? '<span class="dealer-spacer"></span>' : ''}
      ${lblName[dir]}
      ${isDealer ? '<span class="dealer-badge">D</span>' : ''}
    </div>`;
  };

  let leadInfo = null;
  if (lead && lead.length >= 2 && playFirst) {
    leadInfo = { dir: playFirst.toUpperCase(), suit: lead[0].toUpperCase(), card: lead[1].toUpperCase() };
  }
  const rh = (dir, hand) => renderHand(hand, leadInfo && leadInfo.dir === dir ? leadInfo : null);

  const handBox = (dir, hand, ns) => {
    const {suits, hcp} = rh(dir, hand);
    const cls = ns ? 'hand hand-ns' : 'hand';
    return `<div class="${cls}">${handLbl(dir)}${suits}<div class="hcp-badge">${hcp} H</div></div>`;
  };

  return `<div class="diag-grid">
    <div class="diag-row diag-row-ns">${handBox('N', h.N, true)}</div>
    <div class="diag-row">
      <div class="diag-col">${handBox('W', h.W, false)}</div>
      <div class="compass-cell"><div class="compass">
        <span class="cpt cpt-n">N</span><span class="cpt cpt-s">S</span>
        <span class="cpt cpt-o">O</span><span class="cpt cpt-e">E</span>
      </div></div>
      <div class="diag-col">${handBox('E', h.E, false)}</div>
    </div>
    <div class="diag-row diag-row-ns">${handBox('S', h.S, true)}</div>
  </div>`;
}

// ── render auction ─────────────────────────────────────────────────────
function renderAuction(firstBidder, str) {
  const BASE   = ['W','N','E','S'];
  const LABELS = {W:'Ouest',N:'Nord',E:'Est',S:'Sud'};
  const bids   = str.split(/\s+/).filter(b => b && b.toUpperCase() !== 'AP');

  // Rotate columns so first bidder is always the leftmost column
  const startIdx = BASE.indexOf((firstBidder||'').toUpperCase());
  const ORDER = [0,1,2,3].map(i => BASE[(startIdx + i) % 4]);

  let html = ORDER.map(d => `<div class="auc-th">${LABELS[d]}</div>`).join('');
  // First bidder is now column 0, so no offset needed
  bids.forEach(b => { html += `<div class="auc-td">${fmtBid(b)}</div>`; });
  const rem = (4 - (bids.length % 4)) % 4;
  for (let i=0; i<rem; i++) html += '<div class="auc-td"></div>';
  return `<div class="auc-grid">${html}</div>`;
}

// ── format one bid ─────────────────────────────────────────────────────
function fmtBid(bid) {
  if (!bid) return '';
  const b = bid.toUpperCase();
  if (b==='PASS'||b==='P')          return '<span class="bp">Passe</span>';
  if (b==='X'||b==='DBL'||b==='D') return '<span class="bx">X</span>';
  if (b==='XX'||b==='RDBL'||b==='R')return '<span class="bxx">XX</span>';
  if (b==='AP')                     return '';
  const m = b.match(/^([1-7])(S|H|D|C|NT|N)$/);
  if (m) {
    const sym = {S:'♠',H:'♥',D:'♦',C:'♣',NT:'SA',N:'SA'}[m[2]];
    const cls = {S:'c-s',H:'c-h',D:'c-d',C:'c-c'}[m[2]] || 'b-sa';
    return `<strong>${m[1]}</strong><span class="${cls}">${sym}</span>`;
  }
  return esc(bid);
}

// ── boot ───────────────────────────────────────────────────────────────
(function(){
  discoverSeances();
})();
</script>
