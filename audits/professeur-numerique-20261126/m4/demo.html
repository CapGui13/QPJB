const $=id=>document.getElementById(id);let index=0,done=false,help=false,first=null;
const el=(tag,value)=>{const n=document.createElement(tag);n.textContent=value;return n};
function reset(){done=false;help=false;first=null;$('feedback').hidden=true;$('choices').hidden=true;$('show').disabled=false;$('free').hidden=false;$('bid').value='';$('status').textContent='';$('past').disabled=false;const q=cases[index].exercise;$('context').textContent=q.context;$('auction').textContent=q.auction.join(' — ')||'Personne n’a parlé.';$('hand').replaceChildren(...q.hand.map((cards,i)=>el('span',['♠','♥','♦','♣'][i]+' '+cards.join(' '))));$('points').textContent=q.h+' H · '+q.shape.join('-');$('choices').replaceChildren(...[...q.choices].sort().map(c=>{const b=el('button',c);b.type='button';b.addEventListener('click',()=>finish(c));return b}));}
function show(){if(done)return;help=true;$('free').hidden=true;$('show').disabled=true;$('choices').hidden=false;$('choices').querySelector('button').focus()}
function finish(choice){if(done)return;done=true;const c=cases[index],q=c.exercise;const target=choice===q.answer&&first?first:choice;const d=target===c.choice?c.diagnostic:null;const history=$('past').checked?{completed:2,active:{ids:[q.id]},journal:[{mode:'parcours',session:1,answers:[{id:q.id,result:'wrong',choice:target}]}]}:null;const a={exercise:q,choice,diagnostic:choice===target?d:null,history,assisted:help,hadFreeError:!!first};const result=QPJBRemediation.explain(a);const correction=first&&choice===q.answer?QPJBRemediation.explain({...a,choice:first,diagnostic:d}):result;$('verdict').textContent=choice===q.answer?'Bonne réponse':'Réponse attendue : '+q.answer;$('canonical').textContent=result.canonical;$('extra').replaceChildren();for(const [key,label] of [['feedback','Point à vérifier'],['reminder','Rappel'],['checkNext','Sur une autre main']]){const value=correction[key]||result[key];if(value)$('extra').append(el('p',label+' : '+value));}$('feedback').hidden=false;$('show').disabled=true;$('past').disabled=true;$('free').hidden=true;for(const b of $('choices').querySelectorAll('button'))b.disabled=true;$('feedback').focus();}
cases.forEach((c,i)=>{const o=el('option',c.exercise.id+' · '+c.exercise.theme+' · scénario '+(i+1));o.value=i;$('case').append(o)});
$('case').addEventListener('change',()=>{index=Number($('case').value);reset();$('question').focus()});
$('show').addEventListener('click',show);
$('free').addEventListener('submit',e=>{e.preventDefault();if(done)return;const bid=$('bid').value.trim();if(!/^(?:[1-7](?:♠|♥|♦|♣|SA)|Passe|Contre|Surcontre)$/.test(bid)){$('status').textContent='Enchère non reconnue.';return}if(bid===cases[index].exercise.answer)finish(bid);else{first=bid;$('status').textContent='Enchère non attendue. Essaie avec les propositions.';show()}});
$('next').addEventListener('click',()=>{const previous=cases[index].exercise.id;do{index=(index+1)%cases.length}while(cases[index].exercise.id===previous);$('case').value=index;reset();$('question').focus()});reset();
