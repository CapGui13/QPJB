name: QPJB V1 — registre de competences (audit lecture seule)
on:
  pull_request:
    paths:
      - 'audits/QPJB_V1_COMPETENCES_79_CANDIDATES_20261120.json'
      - 'audits/QPJB_V1_COMPETENCES_541_BACKLOG_20261120.json'
      - 'scripts/verify-v1-competences-register.cjs'
      - 'Docs/QUIZZ_V1_CARTOGRAPHIE_AUDIT_20261120.md'
      - 'audits/QPJB_V1_STAYMAN_TEXAS_65_REVUE_20261120.json'
      - 'scripts/verify-v1-stayman-texas-65.cjs'
      - 'Docs/QUIZZ_V1_REVUE_65_STAYMAN_TEXAS_20261120.md'
      - 'audits/QPJB_V1_APRES_FIT_48_PRECLASSIFICATION_20261120.json'
      - 'scripts/verify-v1-apres-fit-48.cjs'
      - 'Docs/QUIZZ_V1_APRES_FIT_48_PRECLASS_20261120.md'
      - 'audits/QPJB_V1_BARRAGE_65_PRECLASSIFICATION_20261120.json'
      - 'audits/QPJB_V1_CHELEM_65_PRECLASSIFICATION_20261120.json'
      - 'scripts/verify-v1-barrages-chelems-130.cjs'
      - 'Docs/QUIZZ_V1_BARRAGES_CHELEMS_130_PRECLASS_20261120.md'
      - 'audits/QPJB_V1_REPONSE_INTER_67_PRECLASSIFICATION_20261120.json'
      - 'audits/QPJB_V1_FORCING_54_PRECLASSIFICATION_20261120.json'
      - 'audits/QPJB_V1_RUBENSOHL_49_PRECLASSIFICATION_20261120.json'
      - 'scripts/verify-v1-inter-forcing-rubensohl-170.cjs'
      - 'Docs/QUIZZ_V1_INTER_FORCING_RUBENSOHL_170_PRECLASS_20261120.md'
      - 'audits/QPJB_V1_193_GROUPES_CANDIDATS_20261120.json'
      - 'audits/QPJB_V1_FINAL_FORTES_42_PRECLASSIFICATION_20261120.json'
      - 'audits/QPJB_V1_FINAL_DRURY_40_PRECLASSIFICATION_20261120.json'
      - 'audits/QPJB_V1_FINAL_MICHAELS_40_PRECLASSIFICATION_20261120.json'
      - 'audits/QPJB_V1_FINAL_ROUDI_38_PRECLASSIFICATION_20261120.json'
      - 'audits/QPJB_V1_FINAL_MULTILANDY_31_PRECLASSIFICATION_20261120.json'
      - 'audits/QPJB_V1_FINAL_OUV_1_PRECLASSIFICATION_20261120.json'
      - 'audits/QPJB_V1_FINAL_APRES_INTER_1_PRECLASSIFICATION_20261120.json'
      - 'scripts/verify-v1-193-final-preclassification.cjs'
      - 'Docs/QUIZZ_V1_193_DERNIERS_CANDIDATS_20261120.md'
      - '.github/workflows/qpjb-v1-competences-audit.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    name: Verifier 1523 QCM, 79 propositions, 541 candidats non classes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check scripts/verify-v1-competences-register.cjs
      - run: node scripts/verify-v1-competences-register.cjs
      - run: node --check scripts/verify-v1-stayman-texas-65.cjs
      - run: node scripts/verify-v1-stayman-texas-65.cjs
      - run: node --check scripts/verify-v1-apres-fit-48.cjs
      - run: node scripts/verify-v1-apres-fit-48.cjs
      - run: node --check scripts/verify-v1-barrages-chelems-130.cjs
      - run: node scripts/verify-v1-barrages-chelems-130.cjs
      - run: node --check scripts/verify-v1-inter-forcing-rubensohl-170.cjs
      - run: node scripts/verify-v1-inter-forcing-rubensohl-170.cjs
      - run: node --check scripts/verify-v1-193-final-preclassification.cjs
      - run: node scripts/verify-v1-193-final-preclassification.cjs
