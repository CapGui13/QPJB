name: QPJB Training smoke
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
  deployments: read
concurrency:
  # Un ancien WebKit bloqué ne doit pas empêcher les tests du commit suivant.
  # Sur main, la concurrence reste groupée par branche ; sur PR, par commit.
  group: qpjb-training-${{ github.ref }}-${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || 'branch' }}
  cancel-in-progress: true
jobs:
  plan:
    name: QPJB plan V1
    runs-on: ubuntu-latest
    outputs:
      level: ${{ steps.plan.outputs.level }}
      base: ${{ steps.plan.outputs.base }}
      head: ${{ steps.plan.outputs.head }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Choisir le niveau depuis une publication attestée
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: node scripts/ci-orchestration-plan.cjs
  quick:
    name: QPJB quick
    needs: plan
    if: ${{ needs.plan.outputs.level == 'QUICK' || needs.plan.outputs.level == 'UI' || needs.plan.outputs.level == 'TARGETED' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Installer le validateur raster (contrat M2)
        run: python3 -m pip install Pillow==12.0.0
      - name: Contrôler ressources et catalogue régénéré
        env:
          BASE: ${{ needs.plan.outputs.base }}
          HEAD: ${{ needs.plan.outputs.head }}
          LEVEL: ${{ needs.plan.outputs.level }}
        run: |
          if [[ "$LEVEL" == TARGETED ]]; then
            python3 scripts/ci-targeted.py --base "$BASE" --head "$HEAD"
          elif node scripts/ci-routine.cjs --eligible "$BASE" "$HEAD"; then
            node scripts/ci-routine.cjs --check "$BASE" "$HEAD"
            if node scripts/ci-routine.cjs --qcm "$BASE" "$HEAD"; then
              python3 scripts/verify_quiz_sef.py --html quizz.html --min-count 1523
              node tests/quizz-catalogue-live.cjs
              node tests/quizz-distractors.cjs
              node tests/quizz-quality.cjs
            fi
            python3 scripts/build_catalogue.py
            python3 tests/repository-layout.py
          else
            python3 scripts/ci-quick-check.py --base "$BASE" --head "$HEAD"
          fi
  ui-chromium:
    name: QPJB UI chromium
    needs: plan
    if: ${{ needs.plan.outputs.level == 'UI' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
      options: --user 1001
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright@1.64.1
      - run: PW_BROWSER=chromium node tests/ci-ui-targeted.cjs
  ui-webkit:
    name: QPJB UI webkit
    needs: plan
    if: ${{ needs.plan.outputs.level == 'UI' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
      options: --user 1001
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright@1.64.1
      - run: PW_BROWSER=webkit node tests/ci-ui-targeted.cjs
  integrity:
    needs: plan
    if: ${{ needs.plan.outputs.level == 'FULL' }}
    name: Audit des données et du code
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Contrôles rapides — structure et régressions Quiz SEF
        run: |
          node tests/training-smoke.cjs
          python3 scripts/verify_quiz_sef.py --html quizz.html --min-count 1523
          node tests/quizz-catalogue-live.cjs
          node tests/quizz-ui-vnext-static.cjs
          node tests/parcours-recommandations-v1.test.js
          node tests/quizz-content-audit.cjs
          node tests/quizz-distractors.cjs
          node tests/quizz-quality.cjs
          node tests/quizz-free-input.cjs
      - name: Contrôles rapides — Entraînement, catalogue et mises à jour
        run: |
          node tests/training-card-integrity.cjs
          node tests/training-lot06-activation.cjs
          node tests/training-lot07-publication.cjs
          node tests/training-lot08-draft.cjs
          node tests/training-lot08-r8h.cjs
          node tests/training-lot09-publication.cjs
          node tests/training-ambiguity.cjs
          node tests/training-review.cjs
          node tests/training-publication-nine.cjs
          node scripts/split_training_data.cjs --check
          node tests/site-update.cjs
          node tests/ci-training-workflow-guard.cjs
          node tests/wave2-ci-lot07-static.cjs
          node tests/wave2-ci-performance.cjs
          node tests/wave2-ci-pages-rollback.cjs
          node tests/wave2-ci-pages-conditions.cjs
          node tests/wave2-ci-coverage.cjs
          node tests/ci-orchestration-core.cjs
          node tests/ci-routine.cjs
          node tests/ci-publication-state.cjs
          python3 tests/ci-publication-archive.py
      - name: Vérifier le contenu exact de l'archive publique
        run: |
          python3 scripts/build_catalogue.py
          python3 tests/repository-layout.py
      - name: Rapports d'intégrité et d'ambiguïté
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: training-integrity
          path: |
            artifacts/training-integrity/report.json
            artifacts/training-ambiguity/report.json
            artifacts/training-ambiguity/report.csv
            artifacts/quizz-content/report.json
            artifacts/quizz-content/report.md
            artifacts/quizz-content/variant-families.csv
            artifacts/quizz-content/distractor-audit.json
            artifacts/quizz-content/distractor-audit.md
            artifacts/quizz-content/qualite-*.md
            artifacts/quizz-content/qualite-*.csv
          retention-days: 14
          if-no-files-found: warn
  parcours-long:
    needs: plan
    if: ${{ needs.plan.outputs.level == 'FULL' }}
    name: Simulations longues du parcours V1
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Independantes des tests rapides et des navigateurs. GitHub ne marque
    # le workflow comme reussi que si tous ses jobs ont reussi.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Recette complete — cinq profils, 65 puis 153 seances
        run: |
          node tests/quizz-parcours.cjs
          node tests/quizz-catalogue-live.cjs --simulate

  smoke:
    needs: plan
    if: ${{ needs.plan.outputs.level == 'FULL' }}
    name: Validation ${{ matrix.browser }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Image officielle Playwright : dependances et Chromium deja presents.
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
      options: --user 1001
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Installer le package Playwright 1.64.1
        timeout-minutes: 5
        run: npm install --no-save playwright@1.64.1
      - name: Test the QCM flow on a simulated iPhone (${{ matrix.browser }})
        run: PW_BROWSER=${{ matrix.browser }} node tests/training-browser.cjs
      - name: Test previously unopened training resources in offline mode (${{ matrix.browser }})
        run: PW_BROWSER=${{ matrix.browser }} node tests/training-offline.cjs
      - name: Check visual layouts, reversibility and performance (${{ matrix.browser }})
        run: PW_BROWSER=${{ matrix.browser }} node tests/training-visual.cjs
      - name: Test Lot 06 activation (chromium; activated dataset)
        run: PW_BROWSER=${{ matrix.browser }} node tests/training-lot06-activation-browser.cjs
      - name: Test Lot 07 selected leads (${{ matrix.browser }})
        run: PW_BROWSER=${{ matrix.browser }} node tests/training-lot07-publication-browser.cjs
      - name: Assert Lot 07 failure diagnostics (${{ matrix.browser }})
        run: PW_BROWSER=${{ matrix.browser }} node tests/wave2-ci-lot07-diagnostic-probe.cjs
      - name: Test the Quizz module and its revision modes (${{ matrix.browser }})
        run: PW_BROWSER=${{ matrix.browser }} node tests/quizz-browser.cjs
      - name: Test the guided progression flow (${{ matrix.browser }})
        run: PW_BROWSER=${{ matrix.browser }} node tests/quizz-parcours-browser.cjs
      - name: Vérifier interface V1 et recommandations (${{ matrix.browser }})
        run: PW_BROWSER=${{ matrix.browser }} node tests/quizz-ui-vnext-browser.cjs
      - name: Retain visual screenshots and timings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: training-visual-${{ matrix.browser }}
          path: |
            artifacts/training-visual/${{ matrix.browser }}/
            artifacts/lot07-publication/${{ matrix.browser }}/
          retention-days: 7
          if-no-files-found: warn

  webkit:
    needs: plan
    if: ${{ needs.plan.outputs.level == 'FULL' }}
    name: Validation webkit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Image officielle Playwright : WebKit et ses bibliotheques OS sont deja installes.
    # Version du package JS identique a celle de l'image pour les executables.
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
      options: --user 1001
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Installer le package Playwright 1.64.1
        timeout-minutes: 5
        run: npm install --no-save playwright@1.64.1
      - name: Test the QCM flow on a simulated iPhone (webkit)
        run: PW_BROWSER=webkit node tests/training-browser.cjs
      - name: Test previously unopened training resources in offline mode (webkit)
        run: PW_BROWSER=webkit node tests/training-offline.cjs
      - name: Check visual layouts, reversibility and performance (webkit)
        run: PW_BROWSER=webkit node tests/training-visual.cjs
      - name: Test Lot 06 activation (webkit; activated dataset)
        run: PW_BROWSER=webkit node tests/training-lot06-activation-browser.cjs
      - name: Test Lot 07 selected leads (webkit)
        run: PW_BROWSER=webkit node tests/training-lot07-publication-browser.cjs
      - name: Assert Lot 07 failure diagnostics (webkit)
        run: PW_BROWSER=webkit node tests/wave2-ci-lot07-diagnostic-probe.cjs
      - name: Test the Quizz module and its revision modes (webkit)
        run: PW_BROWSER=webkit node tests/quizz-browser.cjs
      - name: Test the guided progression flow (webkit)
        run: PW_BROWSER=webkit node tests/quizz-parcours-browser.cjs
      - name: Vérifier interface V1 et recommandations (webkit)
        run: PW_BROWSER=webkit node tests/quizz-ui-vnext-browser.cjs
      - name: Retain WebKit visual screenshots and timings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: training-visual-webkit
          path: |
            artifacts/training-visual/webkit/
            artifacts/lot07-publication/webkit/
          retention-days: 7
          if-no-files-found: warn

  verdict:
    name: QPJB verdict V1 ${{ needs.plan.outputs.level }} ${{ github.sha }} ${{ needs.plan.outputs.base }}
    needs: [plan, quick, ui-chromium, ui-webkit, integrity, parcours-long, smoke, webkit]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verdict fail-closed du commit exact
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: node scripts/ci-orchestration-verdict.cjs
