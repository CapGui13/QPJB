name: QPJB Training smoke
on:
  push:
    branches: [main]
    # Les fichiers générés seuls ne déclenchent pas un nouveau cycle de tests.
    paths-ignore:
      - catalogue.json
      - site-version.json
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  # Un ancien WebKit bloqué ne doit pas empêcher les tests du commit suivant.
  # Sur main, la concurrence reste groupée par branche ; sur PR, par commit.
  group: qpjb-training-${{ github.ref }}-${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || 'branch' }}
  cancel-in-progress: true
jobs:
  integrity:
    name: Audit des données et du code
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Contrôle de structure, exercices et mises à jour
        run: |
          node tests/training-smoke.cjs
          node tests/quizz-integrity.cjs
          node tests/quizz-content-audit.cjs
          node tests/quizz-distractors.cjs
          node tests/quizz-quality.cjs
          node tests/quizz-free-input.cjs
          node tests/quizz-v470-regression.cjs
          node tests/quizz-v471-regression.cjs
          node tests/quizz-v472-regression.cjs
          node tests/quizz-v473-regression.cjs
          node tests/quizz-v474-regression.cjs
          node tests/quizz-v475-regression.cjs
          node tests/quizz-v476-regression.cjs
          node tests/quizz-v477-regression.cjs
          node tests/quizz-v478-regression.cjs
          node tests/quizz-v479-regression.cjs
          node tests/quizz-v480-regression.cjs
          node tests/quizz-v481-regression.cjs
          node tests/quizz-v482-regression.cjs
          node tests/quizz-v483-regression.cjs
          node tests/training-card-integrity.cjs
          node tests/training-ambiguity.cjs
          node tests/training-review.cjs
          node scripts/split_training_data.cjs --check
          node tests/site-update.cjs
      - name: Rapports d'intégrité et d'ambiguïté
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: training-integrity
          path: |
            artifacts/training-integrity/report.json
            artifacts/training-ambiguity/report.json
            artifacts/training-ambiguity/report.csv
            artifacts/quizz-content/report.json
            artifacts/quizz-content/report.md
            artifacts/quizz-content/variant-families.csv
            artifacts/quizz-content/distractor-audit.json
            artifacts/quizz-content/distractor-audit.md
            artifacts/quizz-content/qualite-*.md
            artifacts/quizz-content/qualite-*.csv
          retention-days: 14
          if-no-files-found: warn
  smoke:
    name: Validation ${{ matrix.browser }}
    needs: integrity
    runs-on: ubuntu-latest
    # Image officielle Playwright : dependances et Chromium deja presents.
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
      options: --user 1001
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Installer le package Playwright 1.64.1
        timeout-minutes: 5
        run: npm install --no-save playwright@1.64.1
      - name: Test the QCM flow on a simulated iPhone (${{ matrix.browser }})
        run: PW_BROWSER=${{ matrix.browser }} node tests/training-browser.cjs
      - name: Test previously unopened training resources in offline mode (${{ matrix.browser }})
        run: PW_BROWSER=${{ matrix.browser }} node tests/training-offline.cjs
      - name: Check visual layouts, reversibility and performance (${{ matrix.browser }})
        run: PW_BROWSER=${{ matrix.browser }} node tests/training-visual.cjs
      - name: Test the Quizz module and its revision modes (${{ matrix.browser }})
        run: PW_BROWSER=${{ matrix.browser }} node tests/quizz-browser.cjs
      - name: Retain visual screenshots and timings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: training-visual-${{ matrix.browser }}
          path: artifacts/training-visual/${{ matrix.browser }}/
          retention-days: 7
          if-no-files-found: warn

  webkit:
    name: Validation webkit
    needs: integrity
    runs-on: ubuntu-latest
    # Image officielle Playwright : WebKit et ses bibliotheques OS sont deja installes.
    # Version du package JS identique a celle de l'image pour les executables.
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
      options: --user 1001
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Installer le package Playwright 1.64.1
        timeout-minutes: 5
        run: npm install --no-save playwright@1.64.1
      - name: Test the QCM flow on a simulated iPhone (webkit)
        run: PW_BROWSER=webkit node tests/training-browser.cjs
      - name: Test previously unopened training resources in offline mode (webkit)
        run: PW_BROWSER=webkit node tests/training-offline.cjs
      - name: Check visual layouts, reversibility and performance (webkit)
        run: PW_BROWSER=webkit node tests/training-visual.cjs
      - name: Test the Quizz module and its revision modes (webkit)
        run: PW_BROWSER=webkit node tests/quizz-browser.cjs
      - name: Retain WebKit visual screenshots and timings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: training-visual-webkit
          path: artifacts/training-visual/webkit/
          retention-days: 7
          if-no-files-found: warn
