name: QPJB Training smoke
on:
  push:
    branches: [main]
    # Les fichiers générés seuls ne déclenchent pas un nouveau cycle de tests.
    paths-ignore:
      - catalogue.json
      - site-version.json
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: qpjb-training-${{ github.ref }}
  cancel-in-progress: true
jobs:
  integrity:
    name: Audit des données et du code
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Contrôle de structure, exercices et mises à jour
        run: |
          node tests/training-smoke.cjs
          node tests/quizz-integrity.cjs
          node tests/quizz-content-audit.cjs
          node tests/quizz-distractors.cjs
          node tests/quizz-quality.cjs
          node tests/quizz-free-input.cjs
          node tests/training-card-integrity.cjs
          node tests/training-ambiguity.cjs
          node tests/training-review.cjs
          node scripts/split_training_data.cjs --check
          node tests/site-update.cjs
      - name: Rapports d'intégrité et d'ambiguïté
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: training-integrity
          path: |
            artifacts/training-integrity/report.json
            artifacts/training-ambiguity/report.json
            artifacts/training-ambiguity/report.csv
            artifacts/quizz-content/report.json
            artifacts/quizz-content/report.md
            artifacts/quizz-content/variant-families.csv
            artifacts/quizz-content/distractor-audit.json
            artifacts/quizz-content/distractor-audit.md
            artifacts/quizz-content/qualite-993.md
            artifacts/quizz-content/qualite-993.csv
          retention-days: 14
          if-no-files-found: warn
  smoke:
    name: Validation ${{ matrix.browser }}
    needs: integrity
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser test dependencies
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps ${{ matrix.browser }}
      - name: Test the QCM flow on a simulated iPhone (${{ matrix.browser }})
        run: PW_BROWSER=${{ matrix.browser }} node tests/training-browser.cjs
      - name: Test previously unopened training resources in offline mode (${{ matrix.browser }})
        run: PW_BROWSER=${{ matrix.browser }} node tests/training-offline.cjs
      - name: Check visual layouts, reversibility and performance (${{ matrix.browser }})
        run: PW_BROWSER=${{ matrix.browser }} node tests/training-visual.cjs
      - name: Test the Quizz module and its revision modes (${{ matrix.browser }})
        run: PW_BROWSER=${{ matrix.browser }} node tests/quizz-browser.cjs
      - name: Retain visual screenshots and timings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: training-visual-${{ matrix.browser }}
          path: artifacts/training-visual/${{ matrix.browser }}/
          retention-days: 7
          if-no-files-found: warn
