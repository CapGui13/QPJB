name: M4-D independent native laboratory
on:
  pull_request:
    branches: [coherence-concrete/m4-parallel-d-recette]
    paths: ['.github/workflows/m4p-d-recette.yml']
permissions:
  contents: read
jobs:
  quick:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          git rev-parse HEAD
          node tests/coherence-concrete-m4p-d-test.cjs
          node tests/quizz-parcours.cjs
          node tests/quizz-prerequis.cjs
          node tests/quizz-progression-selection-real.cjs
          node tests/coherence-progression-integration.cjs
          node tests/durable-integration-contract.cjs
          node tests/durable-integration-evidence.cjs
          node tests/durable-m6-guards.cjs
          node tests/wave2-adaptatif-resume.cjs
  matrix:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        profile: [autonome, intermediaire, faible, cible, aide, passe]
        seed: [11, 47, 103]
        policy: [D, K]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tests/coherence-concrete-m4p-d-native.cjs ${{ matrix.profile }} ${{ matrix.seed }} ${{ matrix.policy }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: m4pd-${{ matrix.policy }}-${{ matrix.profile }}-${{ matrix.seed }}
          path: m4p-d-out/
  browser:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright@1.64.1
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      - run: python3 scripts/build_catalogue.py && python3 scripts/build_public_site.py --output _public_site
      - run: PW_BROWSER=${{ matrix.browser }} node tests/durable-integration-browser.cjs _public_site
      - run: PW_BROWSER=${{ matrix.browser }} node tests/progression-guidee-offline.cjs _public_site
      - run: PW_BROWSER=${{ matrix.browser }} node tests/quizz-parcours-browser.cjs
