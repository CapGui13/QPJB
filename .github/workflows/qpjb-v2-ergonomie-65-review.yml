name: QPJB V2 — ergonomie des 65 séances (HOLD)
on:
  push:
    branches:
      - fix/v2-65-ergonomie-20261120
    paths:
      - 'preview/v2-eleve/parcours-sef-65-r1.html'
      - 'tests/v2-ergonomie-65-browser.cjs'
      - 'tests/v2-ergonomie-65-structure.cjs'
      - '.github/workflows/qpjb-v2-ergonomie-65-review.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'preview/v2-eleve/parcours-sef-65-r1.html'
      - 'tests/v2-ergonomie-65-browser.cjs'
      - 'tests/v2-ergonomie-65-structure.cjs'
      - '.github/workflows/qpjb-v2-ergonomie-65-review.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  structure:
    name: Catalogue SEF et syntaxe du parcours
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check tests/v2-ergonomie-65-browser.cjs
      - run: node --check tests/v2-ergonomie-65-structure.cjs
      - run: node tests/v2-ergonomie-65-structure.cjs
      - run: node tests/quizz-parcours.cjs
  navigateur:
    name: Chromium et WebKit — progression et intégration V2
    needs: structure
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
      options: --user 1001
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright@1.64.1
      - run: node tests/v2-ergonomie-65-browser.cjs
      - run: node tests/v2-integration-entry-browser.cjs
