name: QPJB V2 — ergonomie des 65 séances (HOLD)
on:
  workflow_dispatch:

permissions:
  contents: read
jobs:
  structure:
    name: Catalogue SEF et syntaxe du parcours
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check tests/v2-ergonomie-65-browser.cjs
      - run: node --check tests/v2-ergonomie-65-structure.cjs
      - run: node tests/v2-ergonomie-65-structure.cjs
      - run: node tests/quizz-parcours.cjs
  navigateur:
    name: Chromium et WebKit — progression et intégration V2
    needs: structure
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
      options: --user 1001
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright@1.64.1
      - run: node tests/v2-ergonomie-65-browser.cjs
      - run: node tests/v2-integration-entry-browser.cjs
