name: QPJB — ergonomie, benchmark longitudinal
on:
  workflow_dispatch:

permissions:
  contents: read
jobs:
  longitudinal:
    name: Profils fictifs, 23 séances, aucun historique personnel
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check tests/quizz-ergonomie-longitudinal.cjs
      - run: node tests/quizz-ergonomie-longitudinal.cjs
