name: QPJB M3 — recette native temporaire
on:
  pull_request:
    branches: ['apprentissage-durable/m3-maitrise']
    paths: ['.github/workflows/m3-native-temporary.yml']
permissions:
  contents: read
jobs:
  native:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 2f1cfd5b97ae4710093c01f9bfb5c428c46f548a
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright@1.64.1
      - run: npx playwright install --with-deps chromium webkit
      - name: Full native M3 acceptance at exact source SHA
        shell: bash
        run: |
          set -o pipefail
          test "$(git rev-parse HEAD)" = 2f1cfd5b97ae4710093c01f9bfb5c428c46f548a
          node tests/durable-m3-native.cjs | tee m3-native-result.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: m3-native-2f1cfd5
          path: m3-native-result.json
          if-no-files-found: warn
