name: QPJB V2-AV - Ouvertures fortes originales (lecture seule)
on:
  push:
    branches: [audit/parcours-v2-sa-stayman-phase-c-20261118]
    paths:
      - .github/workflows/qpjb-v2-ouvertures-av.yml
      - scripts/parcours-v2-contre-audit-av.cjs
      - Docs/PARCOURS_V2_PHASE_AV_ORIGINAUX_OUVERTURES_20261119.json
      - quizz.html
      - entrainement/training-data-bidding.js
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/qpjb-v2-ouvertures-av.yml
      - scripts/parcours-v2-contre-audit-av.cjs
      - Docs/PARCOURS_V2_PHASE_AV_ORIGINAUX_OUVERTURES_20261119.json
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    name: 5 dossiers origines versus Quiz SEF et Entrainement
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Comparer les sources sans produire de QCM
        run: |
          node --check scripts/parcours-v2-contre-audit-av.cjs
          node scripts/parcours-v2-contre-audit-av.cjs
