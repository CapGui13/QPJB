name: Actualiser le catalogue QPJB
on:
  push:
    branches: [main]
    paths-ignore:
      - catalogue.json
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: qpjb-catalogue
  cancel-in-progress: false

jobs:
  catalogue:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Générer le catalogue
        run: python scripts/build_catalogue.py
      - name: Publier uniquement si nécessaire
        run: |
          git add catalogue.json
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Actualiser automatiquement le catalogue QPJB"
          # Un autre commit peut arriver pendant la génération.
          # Rejouer le catalogue sur le dernier main avant de pousser.
          for attempt in 1 2 3; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then exit 0; fi
            sleep 2
          done
          echo "Impossible de publier le catalogue après 3 tentatives" >&2
          exit 1
