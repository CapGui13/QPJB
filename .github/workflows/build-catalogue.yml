name: Actualiser le catalogue QPJB
# The public archive is always regenerated before deployment. Update the
# tracked generated JSON only AFTER a proven publication, never while
# validation/publication of the source commit is in flight.
on:
  workflow_run:
    workflows: ["QPJB Pages — publication après validation"]
    types: [completed]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: qpjb-catalogue
  cancel-in-progress: false
jobs:
  catalogue:
    if: >-
      ${{ github.ref == 'refs/heads/main' &&
          (github.event_name == 'workflow_dispatch' ||
          (github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.head_branch == 'main' &&
          github.event.workflow_run.event == 'workflow_run' &&
          github.event.workflow_run.head_repository.id == github.repository_id)) }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      deployments: read
    outputs:
      sha: ${{ steps.proof.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - name: Vérifier la dernière publication et son SHA exact
        id: proof
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node - <<'JS'
          const {checkpoint,mainSha}=require('./scripts/ci-publication-state.cjs');
          const fs=require('node:fs');
          const cp=checkpoint();
          if(cp && cp.sha===process.env.GITHUB_SHA && cp.sha===mainSha())
            fs.appendFileSync(process.env.GITHUB_OUTPUT,'sha='+cp.sha+'\n');
          else console.log('No exact attested deployment at current main; no generated commit.');
          JS
  commit:
    needs: catalogue
    if: ${{ needs.catalogue.outputs.sha != '' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.catalogue.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Générer à nouveau à partir du SHA publié
        run: python3 scripts/build_catalogue.py
      - name: Commit signé avec lease sur le parent exact
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED: ${{ needs.catalogue.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$EXPECTED" =~ ^[0-9a-f]{40}$ ]]
          [[ "$(git rev-parse HEAD)" == "$EXPECTED" ]]
          if git diff --quiet -- catalogue.json site-version.json; then exit 0; fi
          # createCommitOnBranch signs the commit on GitHub and atomically
          # rejects a stale expectedHeadOid. Never rebase stale generated bytes.
          node - <<'JS' > "$RUNNER_TEMP/catalogue-mutation.json"
          const fs=require('node:fs');
          const query='mutation($input:CreateCommitOnBranchInput!){createCommitOnBranch(input:$input){commit{oid url}}}';
          const additions=['catalogue.json','site-version.json'].map(path=>({path,contents:fs.readFileSync(path).toString('base64')}));
          const input={branch:{repositoryNameWithOwner:process.env.GITHUB_REPOSITORY,branchName:'main'},
            expectedHeadOid:process.env.EXPECTED,message:{headline:'Actualiser automatiquement le catalogue QPJB'},
            fileChanges:{additions}};
          console.log(JSON.stringify({query,variables:{input}}));
          JS
          gh api graphql --input "$RUNNER_TEMP/catalogue-mutation.json" > "$RUNNER_TEMP/catalogue-result.json"
          node - <<'JS'
          const r=require(process.env.RUNNER_TEMP+'/catalogue-result.json');
          if(r.errors?.length||!r.data?.createCommitOnBranch?.commit?.oid)throw Error('Signed catalogue commit rejected');
          console.log('Catalogue commit:',r.data.createCommitOnBranch.commit.oid);
          JS
