name: Pilote pédagogique — référence S1–S5
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
permissions:
  contents: read
jobs:
  baseline:
    if: github.head_ref == 'pedagogie/pilote-s1-s5-20261127'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          npm install --no-save playwright@1.64.1
          npx playwright install --with-deps chromium
          python3 scripts/build_catalogue.py
          python3 scripts/build_public_site.py --output _public_site
      - run: node tests/pedagogie-pilote-baseline.cjs _public_site pilot-output
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reference-s1-s5
          path: pilot-output/
