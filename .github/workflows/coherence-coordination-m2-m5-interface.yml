name: QPJB Coordination M2 M5 — interface intégrée et protections
on:
  pull_request:
    branches:
      - coherence-concrete/coordination-m2-m5-interface
    paths:
      - '.github/workflows/coherence-coordination-m2-m5-interface.yml'
permissions:
  contents: read
jobs:
  navigateur:
    timeout-minutes: 25
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright@1.64.1
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      - run: python3 scripts/build_catalogue.py && python3 scripts/build_public_site.py --output _public_site
      - run: PW_BROWSER=${{ matrix.browser }} node tests/coherence-concrete-coordinator-m2-m5-browser.cjs _public_site | tee m2-m5-browser.json
      - run: PW_BROWSER=${{ matrix.browser }} node tests/coherence-concrete-coordinator-m5-browser.cjs _public_site | tee m5-browser.json
      - run: PW_BROWSER=${{ matrix.browser }} node tests/durable-integration-browser.cjs _public_site | tee historical-browser.json
      - run: PW_BROWSER=${{ matrix.browser }} node tests/progression-guidee-offline.cjs _public_site
      - run: PW_BROWSER=${{ matrix.browser }} node tests/quizz-parcours-browser.cjs
      - run: PW_BROWSER=${{ matrix.browser }} node tests/quizz-browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: m2-m5-interface-${{ matrix.browser }}
          path: |
            m2-m5-browser.json
            m5-browser.json
            historical-browser.json
  historique:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          node tests/quizz-prerequis.cjs
          node tests/quizz-catalogue-live.cjs
          node tests/durable-integration-contract.cjs
          node tests/durable-integration-evidence.cjs
          node tests/quizz-progression-selection-assets.cjs
          node tests/durable-m6-assets.cjs
          node tests/coherence-concrete-m2-unit.cjs
          node tests/quizz-parcours.cjs
          python3 scripts/verify_quiz_sef.py --html quizz.html --min-count 1915
