name: QPJB Coordination — composition et ordre complet, double modèle
on:
  pull_request:
    branches:
      - coherence-concrete/coordination-composition-full
    paths:
      - '.github/workflows/coherence-coordination-full-composition.yml'
permissions:
  contents: read
jobs:
  paire:
    timeout-minutes: 40
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        profile: [autonome, intermediaire, faible, cible, aide, passe]
        seed: [11, 47, 103]
    env:
      QPJB_COORDINATOR_ATOMIC_FULL: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tests/coherence-concrete-coordinator-campaign.cjs "${{ matrix.profile }}" "${{ matrix.seed }}" 180 m6-output
      - run: node tests/coherence-concrete-coordinator-independent-d.cjs "${{ matrix.profile }}" "${{ matrix.seed }}" d-output
      - uses: actions/upload-artifact@v4
        with:
          name: full-composition-${{ matrix.profile }}-${{ matrix.seed }}
          path: |
            m6-output
            d-output
          retention-days: 7
