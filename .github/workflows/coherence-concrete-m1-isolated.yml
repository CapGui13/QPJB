name: QPJB M1 — recette isolée du curriculum
on:
  pull_request:
    branches: ['coherence-concrete/m1-curriculum']
    paths: ['.github/workflows/coherence-concrete-m1-isolated.yml']
permissions:
  contents: read
env:
  QPJB_M1_POLICY: conditional
jobs:
  quick:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: aca8623a2ef4cbea292b5b98237227213128d1d5
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          git rev-parse HEAD
          node --version
          node tests/coherence-concrete-m1-unit.cjs
          node tests/coherence-concrete-m1-guarded.cjs
          node tests/coherence-concrete-m1-conditional.cjs
          node tests/coherence-concrete-m1-bench.cjs all all 5 quick.json
          node tests/quizz-prerequis.cjs
          node tests/quizz-catalogue-live.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: m1-quick
          path: quick.json
  longitudinal:
    needs: quick
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        profile: [autonome, intermediaire, faible, cible, aide, passe]
        seed: [11, 47, 103]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: aca8623a2ef4cbea292b5b98237227213128d1d5
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          git rev-parse HEAD
          node tests/coherence-concrete-m1-bench.cjs ${{ matrix.profile }} ${{ matrix.seed }} 180 trace.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: m1-${{ matrix.profile }}-${{ matrix.seed }}
          path: trace.json
  browsers:
    needs: quick
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: aca8623a2ef4cbea292b5b98237227213128d1d5
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright@1.64.1
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      - run: |
          node tests/coherence-concrete-m1-bench.cjs all 47 5 browser-reference.json
          PW_BROWSER=${{ matrix.browser }} QPJB_M1_REFERENCE=browser-reference.json node tests/coherence-concrete-m1-browser.cjs > browser.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: m1-browser-${{ matrix.browser }}
          path: browser.json

  historical:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: aca8623a2ef4cbea292b5b98237227213128d1d5
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Historical and current guard suites (unmodified base engine)
        run: |
          mkdir -p historical-results
          failed=0
          for suite in quizz-parcours quizz-parcours-lot-b quizz-progression-selection coherence-progression-m1-unit coherence-progression-m2-policy coherence-progression-m3-boundary coherence-progression-m3-rank durable-integration-contract durable-integration-evidence quizz-prerequis quizz-catalogue-live quizz-progression-selection-assets; do
            if node "tests/$suite.cjs" > "historical-results/$suite.log" 2>&1; then
              echo "$suite PASS" | tee -a historical-results/status.txt
            else
              echo "$suite FAIL" | tee -a historical-results/status.txt
              failed=1
            fi
          done
          exit "$failed"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: m1-historical
          path: historical-results/
