name: QPJB M1 — recette isolée du curriculum
on:
  pull_request:
    branches: ['coherence-concrete/m1-curriculum']
    paths: ['.github/workflows/coherence-concrete-m1-isolated.yml']
permissions:
  contents: read
jobs:
  quick:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: f32e82f2be7265da42ddaf45dac9b3bb57050f36
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          git rev-parse HEAD
          node --version
          node tests/coherence-concrete-m1-unit.cjs
          node tests/coherence-concrete-m1-bench.cjs autonome 47 5 quick.json
          node tests/quizz-prerequis.cjs
          node tests/quizz-catalogue-live.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: m1-quick
          path: quick.json
  longitudinal:
    needs: quick
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        profile: [autonome, intermediaire, faible, cible, aide, passe]
        seed: [11, 47, 103]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: f32e82f2be7265da42ddaf45dac9b3bb57050f36
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          git rev-parse HEAD
          node tests/coherence-concrete-m1-bench.cjs ${{ matrix.profile }} ${{ matrix.seed }} 180 trace.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: m1-${{ matrix.profile }}-${{ matrix.seed }}
          path: trace.json
  browsers:
    needs: quick
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: f32e82f2be7265da42ddaf45dac9b3bb57050f36
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright@1.64.1
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      - run: PW_BROWSER=${{ matrix.browser }} node tests/coherence-concrete-m1-browser.cjs > browser.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: m1-browser-${{ matrix.browser }}
          path: browser.json
