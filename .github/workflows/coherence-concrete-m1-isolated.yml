name: QPJB M1 — recette isolée du curriculum
on:
  pull_request:
    branches: ['coherence-concrete/m1-curriculum']
    paths: ['.github/workflows/coherence-concrete-m1-isolated.yml']
permissions:
  contents: read
env:
  QPJB_M1_POLICY: targeted
jobs:
  quick:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: d08eea9999484e9267e9cc705ed4883df61bf003
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          git rev-parse HEAD
          node --version
          node tests/coherence-concrete-m1-unit.cjs
          node tests/coherence-concrete-m1-guarded.cjs
          node tests/coherence-concrete-m1-conditional.cjs
          node tests/coherence-concrete-m1-fit.cjs
          node tests/coherence-concrete-m1-targeted.cjs
          node tests/coherence-concrete-m1-bench.cjs all all 5 quick.json
          node tests/quizz-prerequis.cjs
          node tests/quizz-catalogue-live.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: m1-quick
          path: quick.json
  longitudinal:
    needs: quick
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        profile: [autonome, intermediaire, faible, cible, aide, passe]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: d08eea9999484e9267e9cc705ed4883df61bf003
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          git rev-parse HEAD
          node tests/coherence-concrete-m1-bench.cjs ${{ matrix.profile }} all 180 trace.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: m1-${{ matrix.profile }}
          path: trace.json
  browsers:
    needs: quick
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: d08eea9999484e9267e9cc705ed4883df61bf003
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright@1.64.1
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      - run: |
          node tests/coherence-concrete-m1-bench.cjs all all 5 browser-reference.json
          PW_BROWSER=${{ matrix.browser }} QPJB_M1_REFERENCE=browser-reference.json node tests/coherence-concrete-m1-browser.cjs > browser.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: m1-browser-${{ matrix.browser }}
          path: browser.json


  historical-reference:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: coherence-progression-m2-policy
            ref: a50c28eb2ecac1305d56e1ce03ce791f4022d171
          - suite: coherence-progression-m3-boundary
            ref: 567b01fde7d42c474fa117271ad4c7ad4d48ac87
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          git rev-parse HEAD | tee historical.log
          set -o pipefail
          node tests/${{ matrix.suite }}.cjs 2>&1 | tee -a historical.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: historical-${{ matrix.suite }}
          path: historical.log
