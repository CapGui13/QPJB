name: Quiz SEF - integrite du catalogue

on:
  pull_request:
    paths:
      - quizz.html
      - scripts/verify_quiz_sef.py
      - scripts/audit_quiz_auction_legality.py
      - tests/test_quiz_sef_integrite.py
      - tests/test_quiz_auction_legality.py
      - .github/workflows/quiz-sef-integrite.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  controle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Tests unitaires du contrôle
        run: python -m unittest discover -s tests -p "test_quiz_sef_integrite.py"
      - name: Verifier cartes, points H, distributions, choix et IDs
        run: python scripts/verify_quiz_sef.py --html quizz.html --min-count 1274
      - name: Tests unitaires du diagnostic formel des enchères
        run: python -m unittest discover -s tests -p "test_quiz_auction_legality.py"
      - name: Diagnostic des enchères (informatif, non homologuant)
        run: python scripts/audit_quiz_auction_legality.py --html quizz.html

  historique:
    # Les anciennes preuves portent sur une édition figée, pas sur les QCM vivants.
    # Le commit de référence contient exactement les données et les tests approuvés.
    if: github.event_name == 'workflow_dispatch'
    name: Recette historique — édition du 24 novembre 2026
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 287bc05fd77d40fcfb98c5927152093e0555c97c
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Rejouer les preuves historiques sans verrouiller le catalogue vivant
        run: |
          node tests/quizz-integrity.cjs
          node tests/quizz-v1-lot-d-11-integration.cjs
          node audits/v1-evolutions/pedagogie/verifier-propositions.cjs
          node tests/quizz-v2-audit.cjs
          node tests/quizz-v2-sa.cjs
          node tests/quizz-l01-regression.cjs
          node tests/quizz-l02-10-regression.cjs
          node tests/quizz-v4112-regression.cjs
          node tests/quizz-v470-regression.cjs
          node tests/quizz-v471-regression.cjs
