# Validation de synthèse V2 uniquement. Ne déclenche jamais de publication Pages.
name: QPJB V2 - Recette transversale sans publication

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scope:
    name: Vérifier si une recette pédagogique est nécessaire
    runs-on: ubuntu-latest
    outputs:
      full: ${{ steps.scope.outputs.full }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Classer le diff réel de la PR
        id: scope
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: node scripts/ci-transversal-scope.cjs

  node-transversal:
    needs: scope
    if: ${{ needs.scope.outputs.full == 'true' }}
    name: M1 pédagogie, M2 rapide et M4 conseils (Node 22)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout complet pour les tests référencés
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Installer Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: M1 - suite pédagogique et protection du catalogue
        run: node tests/wave2-pedagogie-suite.cjs
      - name: Vérifier les deux SEF 2SA et trois validations complémentaires sans autre mutation
        run: node tests/qpjb-sef-approved-2sa-20261123.cjs
      - name: Vérification exhaustive du lot A (5 corrections, 48 HOLD)
        run: node tests/qpjb-sef-approved-lot-a-complement-20261123.cjs
      - name: Vérifier les 26 reformulations proposées sans altérer les 1523 QCM
        run: node tests/qpjb-sef-candidats-26-20261123.cjs
      - name: M2 - sélection, invariants, sauvegardes et profils rapides
        run: node tests/wave2-adaptatif-suite.cjs --quick
      - name: M4 - recommandations et contrôles de non-régression
        run: node --test tests/parcours-recommandations-v1.test.js tests/wave2-recos-*.test.js
      - name: M4 - contrat d'affichage des preuves et intégrité des QCM
        run: node tests/wave2-recos-ui-contract.cjs

  adaptatif-30-trajectoires:
    needs: scope
    if: ${{ needs.scope.outputs.full == 'true' }}
    name: M2 - suite complète 5 profils, 65 et 153 séances
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout complet
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Installer Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Vérifier 30 trajectoires et variantes sans modifier le moteur
        run: node tests/wave2-adaptatif-suite.cjs --full
