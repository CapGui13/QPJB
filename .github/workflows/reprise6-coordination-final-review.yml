name: Reprise6 — candidat assemblé A+B+D
on:
  pull_request:
    branches: [coherence-concrete/coordination-generale]
    types: [opened, synchronize, reopened]
permissions:
  contents: read
jobs:
  identity-and-guards:
    if: github.head_ref == 'coherence-concrete/reprise6-coordination-final-review'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Native proof transfer only for identical engine and all production JS
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs=require('fs'),cp=require('child_process'),assert=require('assert/strict');
          const ref='fb83c7d6fa96a215678fdbbd18a365843cc867b6',git=(...args)=>cp.execFileSync('git',args,{encoding:'utf8',maxBuffer:24*1024*1024});
          const files=git('ls-tree','--name-only',ref).trim().split('\n').filter(p=>p.endsWith('.js')||p.endsWith('.css')||p==='index.html'||p==='config.json');
          for(const p of files)assert.equal(fs.readFileSync(p,'utf8'),git('show',ref+':'+p),p+' differs from validated T candidate');
          const embedded=h=>h.match(/<script id="training-data" type="application\/json">([\s\S]*?)<\/script>/)[1];
          assert.equal(embedded(fs.readFileSync('quizz.html','utf8')),embedded(git('show',ref+':quizz.html')));
          assert.equal(JSON.parse(embedded(fs.readFileSync('quizz.html','utf8'))).exercises.length,1915);
          assert(!fs.readFileSync('quizz-parcours.js','utf8').includes('foundationRecallPlan'),'unvalidated C3');
          console.log('IDENTITY_PASS: '+files.length+' source JS/CSS/config files and catalogue equal to validated T candidate');
          NODE
          node tests/coherence-reprise6-a-contrast.cjs
      - name: Historical guards on actual combined sources
        shell: bash
        run: |
          set -euo pipefail
          node tests/quizz-progression-selection-real.cjs
          node tests/quizz-retours-progression-20261126.cjs
          node tests/quizz-catalogue-live.cjs --early
          node tests/coherence-concrete-coordinator-order-replay-unit.cjs
          node tests/coherence-concrete-coordinator-order-consolidation.cjs
          node tests/durable-integration-contract.cjs
          node tests/durable-integration-evidence.cjs
          node tests/durable-m6-unit.cjs
          node tests/durable-m6-guards.cjs
          node tests/durable-m6-evidence.cjs
          node tests/durable-m6-assets.cjs
          node tests/durable-m6-register.cjs
          python3 scripts/verify_quiz_sef.py --html quizz.html --min-count 1915
  browser:
    if: github.head_ref == 'coherence-concrete/reprise6-coordination-final-review'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          npm install --no-save playwright@1.64.1
          npx playwright install --with-deps "${{ matrix.browser }}"
          python3 scripts/build_catalogue.py
          python3 scripts/build_public_site.py --output _public_site
      - name: Actual combined HTML, feedback and context
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/reprise6-source-http.log 2>&1 &
          server=$!
          trap 'kill "$server" || true' EXIT
          for i in {1..20}; do curl -fsS http://127.0.0.1:8765/quizz.html -o /dev/null && break; sleep 1; done
          PW_BROWSER="${{ matrix.browser }}" node tests/coherence-reprise6-coordination-source-browser.cjs
      - name: Actual combined guided session, diversity, contrast, offline and storage
        shell: bash
        run: |
          set -euo pipefail
          PW_BROWSER="${{ matrix.browser }}" node tests/coherence-reprise6-a-contrast-browser.cjs _public_site
          PW_BROWSER="${{ matrix.browser }}" node tests/progression-guidee-offline.cjs _public_site
          PW_BROWSER="${{ matrix.browser }}" node tests/durable-integration-browser.cjs _public_site
