name: QPJB V2-AF questions only automatic Rubensohl
on:
  push:
    branches: [audit/parcours-v2-sa-stayman-phase-c-20261118]
    paths:
      - .github/workflows/qpjb-v2-af-focused.yml
      - scripts/parcours-v2-questions-seules-af.cjs
      - tests/quizz-v2-questions-seules-af.cjs
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/qpjb-v2-af-focused.yml
      - scripts/parcours-v2-questions-seules-af.cjs
      - tests/quizz-v2-questions-seules-af.cjs
  workflow_dispatch:
permissions:
  contents: read
jobs:
  questions-only-af:
    name: Automatic Rubensohl from session 35, no lessons
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Protéger les QCM et vérifier la progression automatique
        run: node tests/quizz-v2-questions-seules-af.cjs
      - name: Simuler neuf parcours de 45 séances
        run: |
          mkdir -p artifacts/v2-af
          node scripts/parcours-v2-questions-seules-af.cjs > artifacts/v2-af/phase-af-matrix.json
          node - <<'NODE'
          const fs=require('node:fs');
          const r=JSON.parse(fs.readFileSync('artifacts/v2-af/phase-af-matrix.json','utf8'));
          if(r.schema!=='QPJB_AF_AUTOMATIC_RUBENSOHL_2'||
             r.scenarios!==9||r.catalogQuestions!==1523||
             r.sessionsPerScenario!==45||r.questionsPerSession!==10||
             r.policy.noLessons!==true||r.policy.noLessonGate!==true||
             r.policy.teacherConfirmationRequired!==false||
             r.policy.automaticRubensohlIntroSession!==35||
             r.policy.publicRuntimeWired!==false||
             r.allSelectionsMatchReference!==true||
             !r.rows.every(x=>x.firstRubensohlSession===35)||
             r.lessonsAdded!==0||r.productionTouched!==false||
             r.actualStudentsObserved!==0||r.rows.length!==9)
            throw Error('AF : progression automatique / questions seules non conforme');
          const summary={
            schema:r.schema,profiles:r.scenarios,
            sourceQuestions:r.catalogQuestions,rubensohlSourceQuestions:r.advancedSourceQuestions,
            firstRubensohlSession:r.firstRubensohlSessionRange,
            familyRange:r.familyRange,targetedRecallRange:r.recallRange,
            allSelectionsMatchReference:r.allSelectionsMatchReference,
            noManualUnlock:true,noLessonContent:true,publicDeployment:false
          };
          fs.writeFileSync('artifacts/v2-af/phase-af-summary.json',
            JSON.stringify(summary,null,2)+String.fromCharCode(10));
          if(process.env.GITHUB_STEP_SUMMARY){
            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,
              '## QPJB AF — QCM uniquement, progression automatique'+String.fromCharCode(10)+
              '9 simulations × 45 séances : Rubensohl à partir de la séance 35, sans confirmation manuelle.'+String.fromCharCode(10)+
              'Sélections et rappels identiques à la V2-F de référence. Aucun déploiement.'+String.fromCharCode(10));
          }
          console.log('QPJB_PHASE_AF_SUMMARY '+JSON.stringify(summary));
          NODE
      - name: Archiver les résultats
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qpjb-v2-af-questions-only
          path: artifacts/v2-af/
          retention-days: 14
          if-no-files-found: warn
