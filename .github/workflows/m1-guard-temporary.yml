name: QPJB M1 — consolidation autonome native
on:
  pull_request:
    branches: ['apprentissage-durable/m1-adaptation']
    paths: ['.github/workflows/m1-guard-temporary.yml']
permissions:
  contents: read
jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 238a7f8a8d3b7eac889c678aeda3a15a0a88e265
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - shell: bash
        run: |
          set -o pipefail
          test "$(git rev-parse HEAD)" = 238a7f8a8d3b7eac889c678aeda3a15a0a88e265
          node tests/durable-m1-contract.cjs | tee m1-contract.log
          node tests/durable-m1-guard-contract.cjs | tee m1-guard.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: m1-guard-contract
          path: |
            m1-contract.log
            m1-guard.log
  candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - profile: autonome
            seed: 11
          - profile: autonome
            seed: 47
          - profile: autonome
            seed: 103
          - profile: intermediaire
            seed: 11
          - profile: intermediaire
            seed: 47
          - profile: intermediaire
            seed: 103
          - profile: faible
            seed: 11
          - profile: faible
            seed: 47
          - profile: faible
            seed: 103
          - profile: cible
            seed: 11
          - profile: cible
            seed: 47
          - profile: cible
            seed: 103
          - profile: aide
            seed: 11
          - profile: aide
            seed: 47
          - profile: aide
            seed: 103
          - profile: passe
            seed: 11
          - profile: passe
            seed: 47
          - profile: passe
            seed: 103
          - profile: force
            seed: 47
          - profile: longueur
            seed: 47
          - profile: fit
            seed: 47
          - profile: forcing
            seed: 47
          - profile: convention
            seed: 47
          - profile: competition
            seed: 47
          - profile: recuperation
            seed: 47
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 238a7f8a8d3b7eac889c678aeda3a15a0a88e265
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Candidate against preserved witness
        shell: bash
        run: |
          set -o pipefail
          test "$(git rev-parse HEAD)" = 238a7f8a8d3b7eac889c678aeda3a15a0a88e265
          node tests/durable-m1-guard-native.cjs "${{ matrix.profile }}" "${{ matrix.seed }}" | tee m1-proof.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: m1-guard-${{ matrix.profile }}-${{ matrix.seed }}
          path: m1-proof.json
          if-no-files-found: error
