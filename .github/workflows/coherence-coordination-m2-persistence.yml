name: QPJB Coordination M2 — raccordement réel et sauvegardes
on:
  pull_request:
    branches:
      - coherence-concrete/coordination-m2-persistance
    paths:
      - '.github/workflows/coherence-coordination-m2-persistence.yml'
permissions:
  contents: read
jobs:
  paire:
    timeout-minutes: 25
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        profile: [autonome, modere, faible, cible, aide, passe]
        seed: [11, 47, 103]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tests/coherence-concrete-coordinator-m2-persistence.cjs "${{ matrix.profile }}" "${{ matrix.seed }}" 180 result.json
      - uses: actions/upload-artifact@v4
        with:
          name: m2-persistence-${{ matrix.profile }}-${{ matrix.seed }}
          path: result.json
