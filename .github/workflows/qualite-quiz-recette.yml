name: QPJB qualité Quiz — recette finale
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
permissions:
  contents: read
jobs:
  progression:
    if: github.head_ref == 'qualite-quiz/integration'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        profile: [autonome, echecs, modere, aides, progression, faiblesse_passe]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tests/progression-guidee-recette.cjs --candidate --profile "${{ matrix.profile }}" --out artifacts/qualite-quiz/${{ matrix.profile }}.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qualite-quiz-${{ matrix.profile }}
          path: artifacts/qualite-quiz/
  catalogue-et-navigateurs:
    if: github.head_ref == 'qualite-quiz/integration'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          node tests/quizz-prerequis.cjs
          node tests/quizz-progression-selection-assets.cjs
          node tests/quizz-progression-selection-real.cjs
          python3 scripts/build_catalogue.py
          python3 scripts/build_public_site.py --output _public_site
      - run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium webkit
      - run: |
          for browser in chromium webkit; do
            PW_BROWSER="$browser" node tests/quizz-parcours-browser.cjs
            PW_BROWSER="$browser" node tests/progression-guidee-offline.cjs _public_site
          done
