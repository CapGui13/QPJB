name: QPJB optimisation parcours — integration
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
permissions:
  contents: read
jobs:
  compare:
    if: github.head_ref == 'optimisation-parcours/integration' || github.head_ref == 'quiz/retours-261126'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        profile: [autonome, modere, faible, cible, aide, faiblesse_passe]
        seed: [11, 47, 103]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tests/optimisation-parcours-integration.cjs "${{ matrix.profile }}" "${{ matrix.seed }}"
  native:
    if: github.head_ref == 'optimisation-parcours/integration' || github.head_ref == 'quiz/retours-261126'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          node tests/optimisation-adaptatif-maitrise.cjs
          node tests/optimisation-seances-unit.cjs
          node tests/quizz-progression-selection-assets.cjs
          node tests/quizz-prerequis.cjs
          node tests/quizz-progression-selection-real.cjs
          node tests/quizz-catalogue-live.cjs --early
          node tests/quizz-ergonomie-retours.cjs
          if [ -f tests/quizz-retours-progression-20261126.cjs ]; then node tests/quizz-retours-progression-20261126.cjs; fi
          python3 scripts/verify_quiz_sef.py --html quizz.html --min-count 1879
          python3 scripts/build_catalogue.py
          python3 scripts/build_public_site.py --output _public_site
  browsers:
    if: github.head_ref == 'optimisation-parcours/integration' || github.head_ref == 'quiz/retours-261126'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          npm install --no-save playwright@1.64.1
          npx playwright install --with-deps "${{ matrix.browser }}"
          python3 scripts/build_catalogue.py
          python3 scripts/build_public_site.py --output _public_site
      - run: |
          PW_BROWSER="${{ matrix.browser }}" node tests/quizz-parcours-browser.cjs
          PW_BROWSER="${{ matrix.browser }}" node tests/quizz-browser.cjs
          PW_BROWSER="${{ matrix.browser }}" node tests/progression-guidee-offline.cjs _public_site
