name: CI optimisation M2 proofs
on:
  push:
    branches: [ci-optimisation/m2-validations]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-optimisation-m2-${{ github.ref }}
  cancel-in-progress: true
jobs:
  quick:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install native dependency
        run: time python3 -m pip install Pillow==12.0.0
      - name: Real native Git mutations and timings
        run: time python3 tests/ci-quick-proof.py
  ui:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
      options: --user 1001
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
    env:
      PW_BROWSER: ${{ matrix.browser }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install identical Playwright package
        run: time npm install --no-save playwright@1.64.1
      - name: Real targeted public site browser flow
        run: time node tests/ci-ui-targeted.cjs
      - name: Detect broken shared CSS overflow
        shell: bash
        run: |
          set -eu
          log=$(mktemp)
          if QPJB_UI_MUTATION=overflow node tests/ci-ui-targeted.cjs >"$log" 2>&1; then
            cat "$log"; echo "Mutation escaped"; exit 1
          fi
          cat "$log"
          grep -q 'UI_OVERFLOW' "$log"
          echo 'NEGATIVE_PASS overflow'
      - name: Detect missing shared stylesheet
        shell: bash
        run: |
          set -eu
          log=$(mktemp)
          if QPJB_UI_MUTATION=missing-css node tests/ci-ui-targeted.cjs >"$log" 2>&1; then
            cat "$log"; echo "Mutation escaped"; exit 1
          fi
          cat "$log"
          grep -q 'UI_RESOURCE' "$log"
          grep -q '404.*qpjb-bridge-ui.css' "$log"
          echo 'NEGATIVE_PASS missing-css'
