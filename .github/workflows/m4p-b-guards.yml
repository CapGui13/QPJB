name: M4p-B historical guards (unchanged engine)
on:
  pull_request:
    branches: [coherence-concrete/m4-parallel-b-rappels]
permissions:
  contents: read
jobs:
  historical:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: e2af78a8a64fb5eb7db47ef89ee69c350e7c01ed
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          set -eux
          node tests/quizz-parcours.cjs
          node tests/quizz-prerequis.cjs
          node tests/quizz-progression-selection-assets.cjs
          node tests/quizz-progression-selection-real.cjs
          node tests/quizz-retours-progression-20261126.cjs
          node tests/durable-integration-contract.cjs
          node tests/durable-integration-evidence.cjs
          node tests/durable-m6-guards.cjs
          node tests/professeur-numerique-integrated.cjs
          python3 scripts/verify_quiz_sef.py --html quizz.html --min-count 1915
  browser:
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: e2af78a8a64fb5eb7db47ef89ee69c350e7c01ed
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright@1.64.1
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      - run: |
          python3 scripts/build_catalogue.py
          python3 scripts/build_public_site.py --output _public_site
      - run: |
          PW_BROWSER=${{ matrix.browser }} node tests/quizz-parcours-browser.cjs
          PW_BROWSER=${{ matrix.browser }} node tests/progression-guidee-offline.cjs _public_site
          PW_BROWSER=${{ matrix.browser }} node tests/durable-integration-browser.cjs _public_site
