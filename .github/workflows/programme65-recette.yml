name: Programme 65 — recette ciblée
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
permissions:
  contents: read
jobs:
  programme:
    if: github.head_ref == 'pedagogie/programme-65-20261127'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          node --check quizz-parcours.js
          node tests/programme65-recette.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: programme65-selections
          path: programme-output/
