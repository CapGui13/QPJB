name: QPJB Coordination — matrice intégrée M1 M2 M4 M5 M6
on:
  pull_request:
    branches:
      - coherence-concrete/coordination-candidats
    paths:
      - '.github/workflows/coherence-coordination-candidats.yml'
permissions:
  contents: read
jobs:
  paire:
    timeout-minutes: 35
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        profile: [autonome, intermediaire, faible, cible, aide, passe]
        seed: [11, 47, 103]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tests/coherence-concrete-coordinator-campaign.cjs "${{ matrix.profile }}" "${{ matrix.seed }}" 180 coordination-output
      - uses: actions/upload-artifact@v4
        with:
          name: coordination-${{ matrix.profile }}-${{ matrix.seed }}
          path: coordination-output
          retention-days: 7
