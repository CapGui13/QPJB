name: M4 K recette native isolée
on:
  pull_request:
permissions:
  contents: read
jobs:
  campagne:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        profile: [autonome, intermediaire, faible, cible, aide, passe]
        seed: [11, 47, 103]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 67ebd4517fdd61900dd9098abeb26ebd57c24db0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Tests unitaires
        run: |
          node tests/coherence-concrete-m4-unit.cjs
          node tests/coherence-concrete-m4-reactivation.cjs
          node tests/coherence-concrete-m4-cautious.cjs
          node tests/coherence-concrete-m4-protected-recall-test.cjs
      - name: Campagne M4 K S180
        env:
          PROFILE: ${{ matrix.profile }}
          SEED: ${{ matrix.seed }}
          POLICY: K
          HORIZON: 180
          OUT: /tmp/m4-k
        run: node tests/coherence-concrete-m4-campaign.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: m4-k-${{ matrix.profile }}-${{ matrix.seed }}
          path: /tmp/m4-k
          retention-days: 14
  gate:
    needs: campagne
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 67ebd4517fdd61900dd9098abeb26ebd57c24db0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          pattern: m4-k-*
          merge-multiple: true
          path: /tmp/m4-k
      - name: Gate strict sur les 18 trajectoires
        run: |
          set -o pipefail
          node tests/coherence-concrete-m4-gate-k.cjs /tmp/m4-k | tee /tmp/m4-k-gate.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: m4-k-gate
          path: /tmp/m4-k-gate.json
          retention-days: 14
