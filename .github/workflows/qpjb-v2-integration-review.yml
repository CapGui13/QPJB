name: QPJB — entree V1 unique et archive V2 preservee
on:
  workflow_dispatch:

permissions:
  contents: read
jobs:
  guard:
    name: Integrite V1/V2 et absence du lien V2
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check scripts/v2-integration-guard.cjs
      - run: node scripts/v2-integration-guard.cjs
  browser:
    name: Navigation V1 / archive V2 sous Chromium et WebKit
    needs: guard
    runs-on: ubuntu-latest
    timeout-minutes: 12
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
      options: --user 1001
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright@1.64.1
      - run: node --check tests/v2-integration-entry-browser.cjs
      - run: node tests/v2-integration-entry-browser.cjs
