name: QPJB Pages — publication après validation
on:
  workflow_run:
    workflows: ["QPJB Training smoke"]
    types: [completed]
permissions:
  contents: read
concurrency:
  group: qpjb-verified-pages
  cancel-in-progress: false

jobs:
  pages-source:
    name: Vérifier la source et construire l'archive attestée
    if: >-
      ${{ github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.head_branch == 'main' &&
          github.event.workflow_run.event != 'pull_request' &&
          (github.event.workflow_run.event == 'push' || github.event.workflow_run.event == 'workflow_dispatch') &&
          github.event.workflow_run.head_repository.id == github.repository_id }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      deployments: read
      pages: read
    outputs:
      enabled: ${{ steps.source.outputs.enabled }}
      publish: ${{ steps.guard.outputs.publish }}
      archive: ${{ steps.archive.outputs.name }}
    steps:
      - name: Lire le mode de publication de GitHub Pages
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          BUILD_TYPE=$(gh api "repos/${GITHUB_REPOSITORY}/pages" --jq '.build_type' 2>/dev/null || echo unknown)
          if [[ "$BUILD_TYPE" == "workflow" ]]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "Source Pages non attestée : $BUILD_TYPE" >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Télécharger EXACTEMENT le commit testé
        if: steps.source.outputs.enabled == 'true' && github.sha == github.event.workflow_run.head_sha
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Vérifier les jobs, le verdict et la base du run source
        if: steps.source.outputs.enabled == 'true'
        id: guard
        env:
          GH_TOKEN: ${{ github.token }}
          VERIFIED_SHA: ${{ github.event.workflow_run.head_sha }}
          SOURCE_RUN: ${{ github.event.workflow_run.id }}
          SOURCE_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
        run: node scripts/ci-publication-guard.cjs verify
      - name: Générer le catalogue et la version à partir du commit testé
        if: steps.guard.outputs.publish == 'true'
        run: |
          python3 scripts/build_catalogue.py
          python3 scripts/build_public_site.py --output _public_site
      - name: Nommer l'archive unique de cette tentative
        if: steps.guard.outputs.publish == 'true'
        id: archive
        run: echo "name=github-pages-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-pages-artifact@v3
        if: steps.guard.outputs.publish == 'true'
        with:
          path: _public_site
          name: ${{ steps.archive.outputs.name }}

  publish:
    name: QPJB publication V1 ${{ github.event.workflow_run.head_sha }}
    needs: pages-source
    if: ${{ needs.pages-source.outputs.enabled == 'true' && needs.pages-source.outputs.publish == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      VERIFIED_SHA: ${{ github.event.workflow_run.head_sha }}
      ARCHIVE_NAME: ${{ needs.pages-source.outputs.archive }}
    steps:
      # No checkout and no execution of code from the validation artifact in
      # this privileged job. Only this default-branch workflow can deploy.
      - name: Refuser le déploiement si une modification ultérieure n'est pas validée
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$VERIFIED_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$VERIFIED_SHA" == "$GITHUB_SHA" ]]
          [[ "$ARCHIVE_NAME" == "github-pages-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" ]] || {
            echo "::error::Archive d'une autre tentative ; relancer tous les jobs."
            exit 1
          }
          [[ "$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq '.object.sha')" == "$VERIFIED_SHA" ]] || {
            echo "::error::Main a changé ; nouvelle validation nécessaire."
            exit 1
          }
      - uses: actions/configure-pages@v5
      - name: Attendre l'indexation exacte de l'archive GitHub Pages
        id: metadata
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 30); do
            if gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts?per_page=100" > "$RUNNER_TEMP/pages-artifacts.json"; then
              if python3 - <<'PY'
          import json, os, re
          p=json.load(open(os.path.join(os.environ["RUNNER_TEMP"],"pages-artifacts.json")))
          matches=[a for a in p["artifacts"] if a["name"]==os.environ["ARCHIVE_NAME"]]
          if p["total_count"]!=len(p["artifacts"]) or len(matches)!=1:
              raise SystemExit(1)
          a=matches[0]
          assert a["expired"] is False and a["size_in_bytes"]>0
          assert a["workflow_run"]["id"]==int(os.environ["GITHUB_RUN_ID"])
          assert a["workflow_run"]["head_sha"]==os.environ["VERIFIED_SHA"]
          assert re.fullmatch(r"sha256:[0-9a-f]{64}",a["digest"])
          with open(os.environ["GITHUB_OUTPUT"],"a") as out:
              print("id="+str(a["id"]),file=out)
              print("digest="+a["digest"],file=out)
          PY
              then exit 0; fi
            fi
            sleep 2
          done
          echo "::error::Archive unique non attestée après 30 tentatives."
          exit 1
      # REST indexing alone did not prove runtime artifact retrieval in run
      # 45357396379. Exercise the Actions artifact service before deploying.
      - name: Première lecture par le service Actions
        id: runtime-download
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.ARCHIVE_NAME }}
          path: ${{ runner.temp }}/pages-runtime
      - name: Laisser le service Actions rattraper son index
        if: steps.runtime-download.outcome != 'success'
        run: sleep 10
      - name: Deuxième lecture si la première a échoué
        id: runtime-download-2
        if: steps.runtime-download.outcome != 'success'
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.ARCHIVE_NAME }}
          path: ${{ runner.temp }}/pages-runtime
      - name: Dernier délai d'indexation
        if: steps.runtime-download.outcome != 'success' && steps.runtime-download-2.outcome != 'success'
        run: sleep 20
      - name: Dernière lecture obligatoire si les deux précédentes ont échoué
        if: steps.runtime-download.outcome != 'success' && steps.runtime-download-2.outcome != 'success'
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.ARCHIVE_NAME }}
          path: ${{ runner.temp }}/pages-runtime
      - name: Vérifier les octets et le SHA de l'archive réellement récupérée
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ steps.metadata.outputs.id }}
          DIGEST: ${{ steps.metadata.outputs.digest }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$ARTIFACT_ID" =~ ^[0-9]+$ ]]
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip" > "$RUNNER_TEMP/pages-rest.zip"
          python3 - <<'PY'
          import hashlib, json, os, pathlib, tarfile, zipfile
          root=pathlib.Path(os.environ["RUNNER_TEMP"])
          raw=root/"pages-rest.zip"
          assert "sha256:"+hashlib.sha256(raw.read_bytes()).hexdigest()==os.environ["DIGEST"]
          runtime=root/"pages-runtime"/"artifact.tar"
          with zipfile.ZipFile(raw) as z:
              assert z.namelist()==["artifact.tar"]
              assert hashlib.sha256(z.read("artifact.tar")).digest()==hashlib.sha256(runtime.read_bytes()).digest()
          aliases={"Docs/QPJB_V2_REVUE_PEDAGOGIQUE_INTERACTIVE_19_CAS_HOLD_20261120.html",
                   "index A.html","apple-touch-icon.png","favicon-32.png","favicon.svg","icon-192.png","icon-512.png"}
          with tarfile.open(runtime) as t:
              files={}
              for m in t.getmembers():
                  p=pathlib.PurePosixPath(m.name)
                  assert not p.is_absolute() and ".." not in p.parts and "\\" not in m.name
                  assert m.isfile() or m.isdir(), "unsafe tar member"
                  if m.isfile():
                      assert str(p) not in files, "duplicate tar member"
                      files[str(p)]=m
              assert aliases.issubset(files) and ".nojekyll" in files
              assert json.load(t.extractfile(files["site-version.json"]))=={"revision":os.environ["VERIFIED_SHA"]}
              print("Archive attestée :",len(files),"fichiers ; 7 alias ; SHA",os.environ["VERIFIED_SHA"])
          PY
          # Last freshness check, immediately before deploy-pages. There is no
          # atomic ref lock across independent GitHub pushes; concurrency keeps
          # publications serialized, and the archive remains the tested SHA.
          [[ "$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq '.object.sha')" == "$VERIFIED_SHA" ]]
      - name: Déployer QPJB
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: ${{ env.ARCHIVE_NAME }}
