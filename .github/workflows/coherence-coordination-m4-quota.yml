name: QPJB Coordination M4 — quota de maintenance Q/R
on:
  pull_request:
    branches:
      - coherence-concrete/coordination-m4-quota
    paths:
      - '.github/workflows/coherence-coordination-m4-quota.yml'
permissions:
  contents: read
jobs:
  paire:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        profile: [autonome, intermediaire, faible, cible, aide, passe]
        seed: [11, 47, 103]
    env:
      QPJB_COORDINATOR_QUOTA: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tests/coherence-concrete-coordinator-m4-quota-unit.cjs
      - run: node tests/coherence-concrete-coordinator-campaign.cjs "${{ matrix.profile }}" "${{ matrix.seed }}" 180 coordination-output
      - uses: actions/upload-artifact@v4
        with:
          name: quota-${{ matrix.profile }}-${{ matrix.seed }}
          path: coordination-output
          retention-days: 7
