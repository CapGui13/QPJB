name: Reprise 6 A - contraste contextuel et consolidations
on:
  push:
    branches: [coherence-concrete/reprise6-a-context-ci]
permissions:
  contents: read
jobs:
  matrix:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        profile: [autonome, intermediaire, faible, cible, aide, passe]
        seed: [11, 47, 103]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          node tests/coherence-reprise6-a-campaign.cjs "${{ matrix.profile }}" "${{ matrix.seed }}" 180 "reprise6-a-output" lookahead-context
          node tests/coherence-reprise6-a-interleaved.cjs "${{ matrix.profile }}" "${{ matrix.seed }}" 180 "reprise6-a-output"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reprise6-a-context-${{ matrix.profile }}-${{ matrix.seed }}
          path: reprise6-a-output/
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          npm install --no-save playwright@1.64.1
          npx playwright install --with-deps "${{ matrix.browser }}"
          python3 scripts/build_catalogue.py
          python3 scripts/build_public_site.py --output _public_site
      - run: |
          PW_BROWSER="${{ matrix.browser }}" node tests/quizz-parcours-browser.cjs
          PW_BROWSER="${{ matrix.browser }}" node tests/quizz-browser.cjs
          PW_BROWSER="${{ matrix.browser }}" node tests/progression-guidee-offline.cjs _public_site
  historical:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          node tests/coherence-reprise6-a-contract.cjs
          node tests/quizz-parcours.cjs
          node tests/quizz-prerequis.cjs
          node tests/quizz-progression-selection-assets.cjs
          node tests/quizz-progression-selection-real.cjs
          node tests/quizz-retours-progression-20261126.cjs
          node tests/quizz-catalogue-live.cjs --early
          node tests/quizz-ergonomie-retours.cjs
          python3 scripts/verify_quiz_sef.py --html quizz.html --min-count 1879
