name: QPJB V2 - controle correctif editorial HOLD
on:
  pull_request:
    branches: [main]
    paths:
      - 'Docs/PARCOURS_V2_CORRECTIONS_4_QCM_HOLD_20261120.json'
      - 'scripts/v2-editorial-dry-run.cjs'
      - '.github/workflows/qpjb-v2-editorial-hold.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  dry-run:
    name: Simuler 4 QCM sans toucher au site
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check scripts/v2-editorial-dry-run.cjs
      - run: node scripts/v2-editorial-dry-run.cjs
