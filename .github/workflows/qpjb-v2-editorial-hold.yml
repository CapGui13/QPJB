name: QPJB V2 - controle correctif editorial HOLD
on:
  workflow_dispatch:

permissions:
  contents: read
jobs:
  dry-run:
    name: Simuler 4 QCM sans toucher au site
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check scripts/v2-editorial-dry-run.cjs
      - run: node scripts/v2-editorial-dry-run.cjs
      - name: Recuperer l'aperçu V2 d'origine épinglé (lecture seule)
        uses: actions/checkout@v4
        with:
          ref: 88b548763bf271109f7916acbf1858865070f8ae
          path: source-v2
          persist-credentials: false
          sparse-checkout: |
            preview/v2-eleve/
          sparse-checkout-cone-mode: false
      - name: Contrôler l'isolement de sauvegarde et construire l'aperçu HOLD
        run: |
          node --check scripts/v2-editorial-hold-sandbox.cjs
          node scripts/v2-editorial-hold-sandbox.cjs
          node --check scripts/v2-candidate-r1.cjs
          node scripts/v2-candidate-r1.cjs
      - name: Archiver le seul prototype privé — rétention minimale
        uses: actions/upload-artifact@v4
        with:
          name: qpjb-v2-prototype-65-seances-edition-hold
          path: artifacts/v2-editorial-hold-private/
          if-no-files-found: error
          retention-days: 1
      - name: Archiver le candidat V2 valide, non publie
        uses: actions/upload-artifact@v4
        with:
          name: qpjb-v2-candidat-65-pedagogie-validee
          path: artifacts/v2-pedagogy-candidate-private/
          if-no-files-found: error
          retention-days: 1

  browser:
    name: Recette ciblee V2 HOLD — Chromium bureau, WebKit mobile
    needs: dry-run
    runs-on: ubuntu-latest
    timeout-minutes: 12
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
      options: --user 1001
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright@1.64.1
      - name: Recuperer la source élève figée
        uses: actions/checkout@v4
        with:
          ref: 88b548763bf271109f7916acbf1858865070f8ae
          path: source-v2
          persist-credentials: false
          sparse-checkout: |
            preview/v2-eleve/
          sparse-checkout-cone-mode: false
      - name: Fabriquer localement la version de test (HOLD)
        run: |
          node scripts/v2-editorial-dry-run.cjs
          node scripts/v2-editorial-hold-sandbox.cjs
      - name: Recette navigateur et protection des sauvegardes
        run: node tests/v2-editorial-hold-browser.cjs
      - name: Verifier le candidat pedagogique R1
        run: node scripts/v2-candidate-r1.cjs
      - name: Recette du candidat R1 dans les navigateurs
        run: node tests/v2-candidate-r1-browser.cjs
